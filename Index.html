<!DOCTYPE html>
<html lang="uk" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Сон малюка</title>
<style>
/* ===== Теми: світла, темна, нічна (мінімальна яскравість) ===== */
:root{--bg:#f2f0fb;--card:#fff;--ink:#2a2850;--mute:#6f6d92;--acc:#7b82dc;--onacc:#fff;--acc2:#f5b99b;--mint:#8fd3bf;--line:#e2dff3;--err:#c25b5b;--r:22px}
[data-theme=dark]{--bg:#14162b;--card:#1e2140;--ink:#e8e8fa;--mute:#9a9cc4;--acc:#8e95f0;--onacc:#14162b;--acc2:#e8a98c;--mint:#6fbfa8;--line:#2d3160;--err:#e58a8a}
[data-theme=night]{--bg:#080403;--card:#120a07;--ink:#9a6853;--mute:#65443a;--acc:#7a3f30;--onacc:#d9b3a0;--acc2:#6a3a28;--mint:#44523b;--line:#21140f;--err:#a05050}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Nunito","Segoe UI Variable",ui-rounded,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom))}
header{display:flex;gap:10px;align-items:center;padding:14px 16px;max-width:760px;margin:auto}
header h1{font-size:1.25rem;margin:0;flex:1}
select,input,button,textarea{font:inherit;color:inherit}
select,input,textarea{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;width:100%}
header select{width:auto;max-width:120px}header .btn.sm{padding:8px 10px;min-width:44px;flex:0 0 auto}
main{max-width:760px;margin:auto;padding:0 16px}
.card{background:var(--card);border-radius:var(--r);padding:16px 18px;margin:0 0 14px;border:1px solid var(--line)}
.card h3{margin:0 0 6px;font-size:1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.grid .card{margin:0}
.big{font-size:2rem;font-weight:800;letter-spacing:-.02em}
.mute{color:var(--mute);font-size:.92rem}.note{color:var(--mute);font-size:.82rem}.err{color:var(--err);min-height:1.2em}
.btn{background:var(--acc);color:var(--onacc);border:0;border-radius:18px;padding:14px 20px;font-weight:700;cursor:pointer;min-height:52px}
.btn.big{width:100%;font-size:1.2rem;min-height:68px;border-radius:24px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{min-height:40px;padding:8px 14px;border-radius:14px}
.btn.sleep{background:var(--acc2)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.row>*{flex:1}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;padding:8px 2px;font-size:.72rem;color:var(--mute);border-radius:14px;cursor:pointer}
nav button b{display:block;font-size:1.3rem}nav button.on{color:var(--ink);background:var(--line)}
.rec{cursor:pointer;padding:12px 16px}.rec .dur{float:right;font-weight:800}
h3.day{margin:18px 4px 8px;color:var(--mute);font-size:.9rem}
.chart{width:100%;height:auto;display:block}.chart g[data-tip]{cursor:pointer}.chart text{fill:var(--mute);font-size:10px}
.seg{display:flex;gap:8px;margin-bottom:12px}.seg button{flex:1}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--line);font-size:.8rem}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:9}
#modal.on{display:flex}#modal>div{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
label{display:block;margin:10px 0;font-size:.9rem;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;display:none;z-index:10;max-width:90%}
.ok{color:#3a9a6e}.bad{color:var(--err)}
@media(min-width:700px){#modal{align-items:center}#modal>div{border-radius:26px}}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#cloud i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:6px;background:var(--mute);opacity:.5;vertical-align:middle}
#cloud[data-s=online] i{background:#3a9a6e;opacity:1}#cloud[data-s=loading] i,#cloud[data-s=connecting] i{background:#e0a030;opacity:1}#cloud[data-s=error] i,#cloud[data-s=offline] i{background:var(--err);opacity:1}
</style>
</head>
<body>
<header><h1>🌙 Сон малюка</h1><select id="who" aria-label="Профіль дитини"></select><button class="btn ghost sm" id="cloud" onclick="syncModal()" aria-label="Синхронізація">☁️<i></i></button><button class="btn ghost sm" onclick="settings()" aria-label="Налаштування">⚙️</button></header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="modal"><div id="mbox"></div></div>
<div id="toast"></div>
<input type="file" id="imp" accept=".json,application/json" hidden>
<script>
'use strict';
/* ================= Утиліти ================= */
const H=36e5,MIN=6e4,DAY=864e5;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const p2=n=>String(n).padStart(2,'0');
const hm=t=>{const d=new Date(t);return p2(d.getHours())+':'+p2(d.getMinutes())};
const fd=ms=>{const m=Math.max(0,Math.round(ms/MIN));return m<60?m+' хв':Math.floor(m/60)+' год '+p2(m%60)+' хв'};
const dstr=t=>new Date(t).toLocaleDateString('uk-UA',{weekday:'short',day:'numeric',month:'short'});
const inp=t=>{const d=new Date(t);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+'T'+p2(d.getHours())+':'+p2(d.getMinutes())};
const midnight=(t,off=0)=>{const d=new Date(t);return new Date(d.getFullYear(),d.getMonth(),d.getDate()+off)}; // DST-safe межі доби
const mins=t=>{const d=new Date(t);return d.getHours()*60+d.getMinutes()};
const bedMin=t=>(mins(t)-720+1440)%1440+720; // нічний час після півночі лишається «пізнішим»
const clk=m=>p2(Math.floor(m/60)%24)+':'+p2(Math.round(m%60)%60);
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const sd=a=>{if(a.length<2)return 0;const m=avg(a);return Math.sqrt(avg(a.map(x=>(x-m)**2)))};
const med=a=>{const s=[...a].sort((x,y)=>x-y),n=s.length;return n?(n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2):0};
const corr=(x,y)=>{const mx=avg(x),my=avg(y);let a=0,b=0,c=0;x.forEach((v,i)=>{a+=(v-mx)*(y[i]-my);b+=(v-mx)**2;c+=(y[i]-my)**2});return b&&c?a/Math.sqrt(b*c):0};
const kind=t=>{const h=new Date(t).getHours();return h>=19||h<6?'night':'day'};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.k);toast.k=setTimeout(()=>t.style.display='none',3200)};
window.onerror=(m)=>toast('Сталася помилка: '+m);

/* ================= Сховище: IndexedDB + резерв localStorage ================= */
const DB={idb:null,
 async init(){try{this.idb=await new Promise((ok,no)=>{const r=indexedDB.open('sleep-baby',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}catch(e){this.idb=null}},
 async get(k){if(this.idb){try{const v=await new Promise((ok,no)=>{const q=this.idb.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});if(v!==undefined)return v}catch(e){}}
  try{return JSON.parse(localStorage.getItem('sb_'+k))||undefined}catch(e){return undefined}},
 async set(k,v){try{localStorage.setItem('sb_'+k,JSON.stringify(v))}catch(e){}
  if(this.idb){try{await new Promise((ok,no)=>{const t=this.idb.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=ok;t.onerror=()=>no(t.error)})}catch(e){toast('Не вдалося зберегти в IndexedDB; дані є в резервному сховищі.')}}}};
/* Дані: children{id,name,birth}, sleeps{id,cid,start,end|null,type,upd}. id та upd закладені для майбутньої синхронізації між пристроями. */
let S={children:[],sleeps:[],plans:{},theme:'light',active:null,notify:false};
let tab='home',range=7;
const save=()=>{const p=DB.set('state',S);Sync.touch();return p};
const cur=()=>S.children.find(c=>c.id===S.active);
const recs=()=>S.sleeps.filter(r=>r.cid===S.active).sort((a,b)=>a.start-b.start);
const openRec=()=>recs().find(r=>r.end==null);
const dur=(r,now=Date.now())=>(r.end==null?now:r.end)-r.start;
const total=l=>l.reduce((s,r)=>s+dur(r),0);

/* ================= Вік і вікові орієнтири ================= */
function age(bd,now=new Date()){const b=new Date(bd);let m=(now.getFullYear()-b.getFullYear())*12+now.getMonth()-b.getMonth();let ref=new Date(b.getFullYear(),b.getMonth()+m,b.getDate());if(ref>now){m--;ref=new Date(b.getFullYear(),b.getMonth()+m,b.getDate())}return{m,d:Math.floor((now-ref)/DAY)}}
const ageM=()=>{const a=age(cur().birth);return a.m+a.d/30.4};
/* Таблиця 1 — ПІДТВЕРДЖЕНІ рекомендації (години сну за добу з нічним і денним сном): WHO 2019 (<5 років) та AASM, Paruthi et al., 2016.
   Точки поставлено в середині вікових груп джерел, між ними — лінійна інтерполяція, тож стрибків немає. */
const TOTAL=[[0,[14,17]],[2,[14,17]],[8,[12,16]],[18,[11,14]],[24,[11,14]],[48,[10,13]]];
/* Таблиця 2 — ОРІЄНТОВНІ ПРИПУЩЕННЯ (не клінічна норма): [міс, вікно неспання хв, денних снів, нічний сон год]. Узагальнені практичні орієнтири, єдиного наукового джерела немає. */
const PRACT=[[0,[40,70],[4,6],[8,10]],[3,[70,110],[3,5],[9,11]],[6,[110,150],[3,4],[10,11]],[9,[140,180],[2,3],[10,12]],[12,[170,220],[2,2],[10,12]],[18,[230,300],[1,2],[10,12]],[24,[300,390],[1,1],[10,12]],[36,[360,480],[0,1],[10,12]]];
function interp(T,m){let i=0;while(i<T.length-2&&m>T[i+1][0])i++;const a=T[i],b=T[i+1],t=Math.min(1,Math.max(0,(m-a[0])/(b[0]-a[0])));
 return a.slice(1).map((v,k)=>v.map((x,j)=>x+(b[k+1][j]-x)*t))}

/* ================= Статистика ================= */
// Сон належить до доби, у якій він ЗАВЕРШИВСЯ: нічний 22:00–07:00 рахується цілим (9 год) у добу пробудження.
function dayStats(day){const a=+day,b=+midnight(day,1),rs=recs().filter(r=>{const e=r.end==null?Date.now():r.end;return e>=a&&e<b});
 const nt=rs.filter(r=>r.type==='night'),nap=rs.filter(r=>r.type==='day');
 return{day,rs,total:total(rs),night:total(nt),nap:total(nap),napN:nap.length,bed:nt.length?nt[0].start:null,wake:nt.length?nt[nt.length-1].end:null,lastNapEnd:nap.length?nap[nap.length-1].end:null}}
const days=n=>Array.from({length:n},(_,i)=>midnight(Date.now(),-(n-1-i)));
function hist(n){let l=days(n+1).slice(0,n).map(dayStats).filter(s=>s.rs.length);return l.length?l:days(n).map(dayStats).filter(s=>s.rs.length)}
function gaps(from){const r=recs(),g=[];for(let i=1;i<r.length;i++){const a=r[i-1];if(a.end==null)continue;const w=r[i].start-a.end;if(r[i].start>=from&&w>0&&w<12*H)g.push({w,next:r[i].type,at:a.end})}return g}

/* ================= Прогноз наступного сну ================= */
function wwEst(){const mid=interp(PRACT,ageM())[0],am=(mid[0]+mid[1])/2*MIN;
 const g=gaps(Date.now()-7*DAY).filter(x=>x.next==='day').map(x=>x.w);
 return g.length>=3?{ms:.75*med(g)+.25*am,own:med(g),am,n:g.length,sp:Math.max(15*MIN,sd(g))}:{ms:am,am,n:g.length,sp:30*MIN}}
function predict(){const r=recs();if(!r.length)return null;const l=r[r.length-1];if(l.end==null)return{sleeping:true};
 const w=wwEst(),notes=[];let ms=w.ms;
 if(l.type==='day'&&l.end-l.start<40*MIN){ms*=.9;notes.push('останній денний сон був коротким (менше 40 хв), тому вікно скорочено на 10%')}
 const t=l.end+ms,sp=w.sp*.7;return{t,w,notes,night:new Date(t).getHours()>=19,lo:t-sp,hi:t+sp}}
function explain(p){const w=p.w,f=m=>fd(m);let s=w.n>=3?`Враховано ваш фактичний режим: типове вікно неспання за 7 днів — ${f(w.own)} (${w.n} спостережень), і вікові орієнтири для ${age(cur().birth).m} міс. — ${f(w.am)}. Вага 75% / 25%: вікна неспання за віком — практичний орієнтир без перевірених досліджень, тому ваші дані важать більше.`:`Даних про ваш режим поки мало (${w.n} з 3 потрібних), тому прогноз спирається лише на орієнтовне вікно для віку — ${f(w.am)}.`;
 return s+' Відлік іде від останнього пробудження о '+hm(recs().slice(-1)[0].end)+'.'+(p.notes.length?' Також: '+p.notes.join('; ')+'.':'')}

/* ================= Профілі ================= */
function childModal(id){const c=id?S.children.find(x=>x.id===id):null;
 modal(`<h2>${c?'Профіль дитини':'Новий профіль дитини'}</h2><label>Ім’я<input id=cn value="${c?esc(c.name):''}" maxlength=40></label><label>Дата народження<input type=date id=cb value="${c?c.birth:''}" max="${inp(Date.now()).slice(0,10)}"></label><p class=err id=err></p><div class=row><button class=btn onclick="saveChild('${id||''}')">Зберегти</button>${S.children.length&&!c||c?'<button class="btn ghost" onclick=closeM()>Скасувати</button>':''}</div>`)}
function saveChild(id){const n=$('#cn').value.trim(),b=$('#cb').value;if(!n)return $('#err').textContent='Введіть ім’я дитини.';
 if(!b||isNaN(Date.parse(b))||new Date(b)>new Date())return $('#err').textContent='Вкажіть коректну дату народження (не в майбутньому).';
 if(id){const c=S.children.find(x=>x.id===id);c.name=n;c.birth=b}else{const c={id:uid(),name:n,birth:b};S.children.push(c);S.active=c.id}
 save();closeM();render()}
function delChild(id){if(!confirm('Видалити профіль і всі його записи сну'+(Sync.user?' на всіх підключених пристроях':'')+'? Дію не можна скасувати.'))return;
 S.children=S.children.filter(c=>c.id!==id);S.sleeps=S.sleeps.filter(r=>r.cid!==id);delete S.plans[id];S.active=S.children[0]?.id||null;save();closeM();render();if(!S.children.length)childModal()}
function setChild(id){S.active=id;save();render()}

/* ================= Записи сну ================= */
function toggleSleep(){const o=openRec(),n=Date.now();let id,ph;if(o){o.end=n;o.upd=n;id=o.id;ph='w';toast('Малюк прокинувся: '+fd(o.end-o.start))}else{id=uid();ph='s';S.sleeps.push({id,cid:S.active,start:n,end:null,type:kind(n),upd:n})}save();render();noteModal(id,ph)}
function recModal(id){const r=id?S.sleeps.find(x=>x.id===id):null,s=r?r.start:Date.now()-H;
 modal(`<h2>${r?'Редагувати запис':'Новий запис сну'}</h2><label>Початок<input type=datetime-local id=f1 value="${inp(s)}"></label><label>Завершення (порожньо — ще спить)<input type=datetime-local id=f2 value="${r?(r.end!=null?inp(r.end):''):inp(Date.now())}"></label><label>Тип<select id=f3><option value=day>Денний</option><option value=night>Нічний</option></select></label>${noteFields(r||{})}<p class=err id=err></p><div class=row><button class=btn onclick="saveRec('${id||''}')">Зберегти</button>${r?`<button class="btn ghost" onclick="delRec('${id}')">Видалити</button>`:''}<button class="btn ghost" onclick=closeM()>Скасувати</button></div>`);$('#f3').value=r?r.type:kind(s)}
function saveRec(id){const s=new Date($('#f1').value).getTime(),e=$('#f2').value?new Date($('#f2').value).getTime():null,E=t=>$('#err').textContent=t;
 if(!Number.isFinite(s))return E('Вкажіть час початку.');if(e!=null&&!Number.isFinite(e))return E('Некоректний час завершення.');
 if(e!=null&&e<=s)return E('Завершення має бути пізніше за початок.');if(s>Date.now()+MIN)return E('Початок сну не може бути в майбутньому.');
 if((e??Date.now())-s>24*H)return E('Один запис не може тривати довше за 24 години.');
 const bad=S.sleeps.find(x=>x.cid===S.active&&x.id!==id&&x.start<(e??Infinity)&&(x.end??Infinity)>s);
 if(bad)return E(`Запис перетинається з уже існуючим сном (${hm(bad.start)}–${bad.end==null?'триває':hm(bad.end)}, ${dstr(bad.start)}). Змініть час.`);
 const type=$('#f3').value,n=Date.now();
 if(id){Object.assign(S.sleeps.find(x=>x.id===id),{start:s,end:e,type,upd:n,...readNotes()})}else S.sleeps.push({id:uid(),cid:S.active,start:s,end:e,type,upd:n,...readNotes()});
 save();closeM();render()}
function delRec(id){if(!confirm('Видалити цей запис?'))return;S.sleeps=S.sleeps.filter(x=>x.id!==id);save();closeM();render()}
function demo(){const n=Date.now();let t=midnight(n,-14).getTime();for(let d=14;d>=1;d--){const b=midnight(n,-d);
 const jit=()=>(Math.random()-.5)*40*MIN,mk=(s,e,ty)=>S.sleeps.push({id:uid(),cid:S.active,start:s,end:e,type:ty,upd:n,fall:['rock','breast','self','pacifier'][Math.floor(Math.random()*4)],place:'crib'});
 const ws=b.getTime()+6.7*H+jit();mk(ws-10*H-jit(),ws,'night');const k=2+(Math.random()>.6?1:0);let c=ws+2.2*H;
 for(let i=0;i<k;i++){const l=(50+Math.random()*50)*MIN;mk(c,c+l,'day');c+=l+2.5*H+jit()}}
 const ls=recs().filter(r=>r.end&&r.end<n);save();closeM();render();toast('Додано демонстраційні дані за 14 днів.')}

/* ================= Примітки до сну: довідники ================= */
const FALL={breast:'груди',bottle:'пляшечка',rock:'заколисування / на руках',carry:'переноска / слінг',stroller:'у візку',car:'в авто',pacifier:'пустушка',pat:'поглажування / присутність',self:'сам(а) у ліжечку',other:'інше'};
const PLACE={crib:'ліжечко',bassinet:'колиска / люлька',parents:'ліжко дорослих',arms:'на руках',stroller:'візок',car:'автокрісло / авто',sofa:'диван / крісло',other:'інше'};
const WAKE={self:'прокинувся сам(а)',noise:'розбудив шум',parent:'розбудили дорослі',hunger:'прокинувся голодним',cry:'з плачем'};
const MOOD={calm:'спокійний',fussy:'вередливий',cry:'плакав'};
const UNSAFE=['parents','sofa','car','stroller']; // місця, небезпечні для сну немовляти за AAP 2022
const sel=(id,o,v)=>`<select id=${id}><option value="">—</option>${Object.entries(o).map(([k,t])=>`<option value=${k} ${k===v?'selected':''}>${t}</option>`).join('')}</select>`;

 const cnt={};f.forEach(r=>cnt[r.fall]=(cnt[r.fall]||0)+1);const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${FALL[k]} — ${Math.round(v/f.length*100)}%`).join('; ');
 const lt=rs.filter(r=>Number.isFinite(r.lat)).map(r=>r.lat),nn=rs.filter(r=>r.type==='night'&&Number.isFinite(r.nw)).map(r=>r.nw),wk=rs.filter(r=>r.mood);

function habitAdvice(){const A=[],rs=hist(30).flatMap(d=>d.rs).filter(r=>r.end!=null),f=rs.filter(r=>r.fall),nn=rs.filter(r=>r.type==='night'&&Number.isFinite(r.nw)).map(r=>r.nw);
 if(f.length>=5){const as=f.filter(r=>r.fall!=='self').length/f.length;A.push({n:`У ${Math.round(as*100)}% записаних снів малюк засинає за участі дорослого (годування, заколисування, пустушка тощо).`,d:`${f.length} снів із приміткою за 30 днів.`,w:'У немовлят це дуже поширено; здатність засинати самостійно формується поступово й різниться між дітьми (припущення, а не висновок про вашу дитину).',t:'Якщо вас усе влаштовує — змінювати нічого не треба. Якщо хочете змін, обговоріть підхід з педіатром, особливо для дітей до 6 міс.',c:conf(Math.floor(f.length/3)),s:'Описові дані; інтерпретація — припущення'})}
 if(nn.length>=3){const a=avg(nn);A.push({n:`Нічних пробуджень у середньому ${a.toFixed(1)} за ніч.`,d:`${nn.length} ночей із записаною кількістю пробуджень.`,w:'Нічні пробудження часті в немовлят: у систематичному огляді середні значення в різних дослідженнях сягали 3,4 за ніч у 0–2 міс. і 2,5 у 1–2 роки, тож чіткої межі «норми» немає.',t:a>3?'Якщо пробудження виснажують дитину чи родину або супроводжуються утрудненим диханням чи відмовою від їжі, зверніться до педіатра.':'Зазвичай достатньо спостерігати.',c:conf(nn.length),s:'Galland et al., Sleep Med Rev 2012;16:213–222'})}

function buildReport(withNotes){const a=age(cur().birth),ds=aiDays(),T=interp(TOTAL,ageM())[0],gp=gaps(Date.now()-30*DAY),ld=t=>inp(t).replace('T',' ');
 const rows=ds.map(d=>[inp(d.day).slice(0,10),(d.total/H).toFixed(1),(d.night/H).toFixed(1),(d.nap/H).toFixed(1),d.napN,d.bed?hm(d.bed):'-',d.wake?hm(d.wake):'-',d.lastNapEnd?hm(d.lastNapEnd):'-'].join(' | ')).join('\n');
 const rec=recs().filter(r=>r.start>Date.now()-14*DAY).map(r=>`${ld(r.start)} → ${r.end==null?'триває':ld(r.end).slice(11)} | ${r.type==='night'?'нічний':'денний'}${r.fall?' | засинання: '+FALL[r.fall]:''}${r.place?' | місце: '+PLACE[r.place]:''}${Number.isFinite(r.lat)?' | до сну '+r.lat+' хв':''}${r.wakeBy?' | прокинувся: '+WAKE[r.wakeBy]:''}${r.mood?' | настрій: '+MOOD[r.mood]:''}${Number.isFinite(r.nw)?' | нічних пробуджень '+r.nw:''}${withNotes&&r.note?' | примітка: '+r.note:''}`).join('\n');
 return`Ти — досвідчений дитячий сомнолог-консультант. Проаналізуй щоденник сну дитини віком ${a.m} міс. ${a.d} дн. Відповідай українською, простою мовою для батьків.

Структура звіту: 1) Короткий висновок; 2) Що видно в даних (факти); 3) Можливі пояснення (явно познач, що це припущення); 4) На що звернути увагу й що спостерігати; 5) Практичні поради; 6) Безпека сну; 7) Коли звернутися до педіатра; 8) Обмеження цих даних.
Правила: не став діагнозів і не вигадуй медичних висновків; для кожного висновку вкажи рівень достовірності (високий/середній/низький); не роби причинно-наслідкових висновків лише зі збігів; посилайся на джерела лише ті, у яких певен (WHO 2019, AASM 2016, Galland 2012, AAP 2022); пам’ятай, що вікові «вікна неспання» не мають наукового підтвердження; якщо даних замало — так і скажи; діти індивідуальні.

Орієнтир для віку (WHO/AASM, загальний сон за добу з денним): ${T[0]}–${T[1]} год.
Середнє неспання між снами за 30 днів: ${gp.length?fd(avg(gp.map(g=>g.w))):'немає даних'}.

Сон по добах (доба = день завершення сну). Колонки: дата | усього, год | ніч, год | день, год | денних снів | засинання вночі | пробудження вранці | кінець останнього денного сну
${rows}

Окремі записи за останні 14 днів:
${rec}`}

  const j=await r.json();if(!r.ok)throw new Error(j.error&&j.error.message||'HTTP '+r.status);

/* ---- «Чому сьогодні сон був таким?» ---- */
function why(){const T=dayStats(midnight(Date.now())),prev=days(8).slice(0,7).map(dayStats).filter(s=>s.rs.length);
 if(!T.rs.length)return'<p class=mute>Додайте сьогоднішні записи, і тут з’явиться порівняння з попередніми днями.</p>';
 if(prev.length<2)return'<p class=mute>Потрібно хоча б 2 попередні дні із записами, щоб було з чим порівнювати.</p>';
 const L=[],pn=avg(prev.map(d=>d.nap)),dn=T.nap-pn;
 if(Math.abs(dn)>30*MIN)L.push(`Денного сну сьогодні ${dn<0?'менше':'більше'}, ніж зазвичай: ${fd(T.nap)} проти ${fd(pn)} у середньому за ${prev.length} дн.`);
 const pc=avg(prev.map(d=>d.napN));if(Math.abs(T.napN-pc)>=1)L.push(`Денних снів сьогодні ${T.napN}, а зазвичай близько ${pc.toFixed(1)}.`);
 const le=prev.filter(d=>d.lastNapEnd).map(d=>mins(d.lastNapEnd));
 if(T.lastNapEnd&&le.length&&Math.abs(mins(T.lastNapEnd)-avg(le))>40)L.push(`Останній денний сон закінчився о ${hm(T.lastNapEnd)}, зазвичай близько ${clk(avg(le))}. Пізніше завершення іноді зсуває вечірнє засинання.`);
 const pnt=avg(prev.filter(d=>d.night).map(d=>d.night));if(T.night&&pnt&&Math.abs(T.night-pnt)>45*MIN)L.push(`Нічний сон, що закінчився сьогодні, тривав ${fd(T.night)} — ${T.night<pnt?'коротше':'довше'} за звичний (${fd(pnt)}).`);
 const gt=gaps(+midnight(Date.now())).map(g=>g.w),gp=gaps(Date.now()-8*DAY).filter(g=>g.at<+midnight(Date.now())).map(g=>g.w);
 if(gt.length&&gp.length&&Math.abs(avg(gt)-avg(gp))>30*MIN)L.push(`Періоди неспання сьогодні ${avg(gt)>avg(gp)?'довші':'коротші'} (у середньому ${fd(avg(gt))} проти ${fd(avg(gp))}).`);
 const pr=prev.filter(d=>d.bed&&d.nap);if(pr.length>=4){const r=corr(pr.map(d=>d.nap),pr.map(d=>bedMin(d.bed)));
  if(Math.abs(r)>.5)L.push(`За останні дні помітно: ${r<0?'після коротшого денного сну дитина засинала ввечері раніше':'після довшого денного сну дитина засинала ввечері пізніше'}. Це може бути індивідуальною закономірністю або збігом. Поспостерігайте, чи повториться вона.`)}
 if(!L.length)L.push('Сьогоднішній день у межах вашого звичайного ритму: помітних відхилень від попередніх днів немає.');
 return L.map(x=>`<p>• ${x}</p>`).join('')+`<p class=note>Це спостереження за збігами, а не причини й наслідки.${new Date().getHours()<20?' День ще триває, тому дані неповні.':''}</p>`}

/* ---- Щоденник ---- */
function vDiary(){const R=recs();if(!R.length)return emptyHint;let h='<div class=row><button class=btn onclick="recModal()">＋ Додати запис</button></div>',ld='';
 [...R].reverse().forEach(r=>{const k=dstr(r.end??r.start);if(k!==ld){h+=`<h3 class=day>${k}</h3>`;ld=k}const p=R[R.indexOf(r)-1],g=p&&p.end!=null&&r.start-p.end<12*H?'Неспання перед цим сном: '+fd(r.start-p.end):'';
  h+=`<div class="card rec" tabindex=0 onclick="recModal('${r.id}')" onkeydown="if(event.key==='Enter')recModal('${r.id}')"><b>${r.type==='night'?'🌙 Нічний':'☀️ Денний'}</b> ${hm(r.start)} – ${r.end==null?'триває':hm(r.end)}<span class=dur>${fd(dur(r))}</span><div class=mute>${g}</div><div class=note>${noteLine(r)}</div></div>`});
 return h+'<p class=note>Натисніть на запис, щоб змінити час чи видалити.</p>'}

/* ---- Аналітика (SVG без бібліотек) ---- */
function chartTotals(n){const ds=days(n).map(dayStats),W=640,Hh=220,pl=30,pb=22,max=Math.max(18*H,...ds.map(d=>d.total)),y=v=>Hh-pb-(v/max)*(Hh-pb-10),bw=(W-pl)/n,tr=interp(TOTAL,ageM())[0];
 let g=`<rect x="${pl}" y="${y(tr[1]*H)}" width="${W-pl}" height="${y(tr[0]*H)-y(tr[1]*H)}" fill="var(--mint)" opacity=".3"><title>Орієнтовний діапазон WHO/AASM</title></rect>`;
 [0,6,12,18].forEach(v=>g+=`<text x="2" y="${y(v*H)+3}">${v}</text>`);
 ds.forEach((d,i)=>{const x=pl+i*bw+bw*.15,w=bw*.7,yn=y(d.night),yt=y(d.night+d.nap),tip=`${dstr(d.day)}: всього ${fd(d.total)} (ніч ${fd(d.night)}, день ${fd(d.nap)}, денних снів ${d.napN})`;
  g+=`<g data-tip="${tip}" tabindex=0><rect x="${x}" y="${yn}" width="${w}" height="${Hh-pb-yn}" fill="var(--acc)" rx="3"/><rect x="${x}" y="${yt}" width="${w}" height="${yn-yt}" fill="var(--acc2)" rx="3"/><rect x="${pl+i*bw}" y="0" width="${bw}" height="${Hh}" fill="transparent"/></g>`;
  if(n<=7||i%5===0)g+=`<text x="${x}" y="${Hh-6}">${d.day.getDate()}.${p2(d.day.getMonth()+1)}</text>`});
 return`<svg class=chart viewBox="0 0 ${W} ${Hh}" role=img aria-label="Тривалість сну за добу">${g}</svg>`}
function chartCompare(){const A=days(7).map(dayStats),B=days(14).slice(0,7).map(dayStats),W=640,Hh=200,pl=30,pb=22,max=Math.max(18*H,...A.map(d=>d.total),...B.map(d=>d.total)),y=v=>Hh-pb-(v/max)*(Hh-pb-10),bw=(W-pl)/7;let g='';
 A.forEach((d,i)=>{const b=B[i],x=pl+i*bw+bw*.1,w=bw*.38;
  g+=`<g data-tip="${dstr(b.day)}: ${fd(b.total)} (минулий тиждень) · ${dstr(d.day)}: ${fd(d.total)} (поточний)" tabindex=0><rect x="${x}" y="${y(b.total)}" width="${w}" height="${Hh-pb-y(b.total)}" fill="var(--line)" rx="3"/><rect x="${x+w+3}" y="${y(d.total)}" width="${w}" height="${Hh-pb-y(d.total)}" fill="var(--acc)" rx="3"/><rect x="${pl+i*bw}" y="0" width="${bw}" height="${Hh}" fill="transparent"/><text x="${x}" y="${Hh-6}">${d.day.toLocaleDateString('uk-UA',{weekday:'short'})}</text></g>`});
 [0,6,12,18].forEach(v=>g+=`<text x="2" y="${y(v*H)+3}">${v}</text>`);
 return{svg:`<svg class=chart viewBox="0 0 ${W} ${Hh}" role=img aria-label="Порівняння тижнів">${g}</svg>`,A,B}}
function vStats(){if(!recs().length)return emptyHint;const h=hist(range),gp=gaps(Date.now()-range*DAY),dn=h.filter(d=>d.night),sl=h.flatMap(d=>d.rs).filter(r=>r.end!=null);
 const card=(l,v)=>`<div class=card><div class=mute>${l}</div><div class=big style="font-size:1.4rem">${v}</div></div>`;
 const bed=h.filter(d=>d.bed).map(d=>bedMin(d.bed)),wk=h.filter(d=>d.wake).map(d=>mins(d.wake)),nz=h.filter(d=>d.napN);
 const cmp=chartCompare(),a7=avg(cmp.A.filter(d=>d.rs.length).map(d=>d.total)),b7=avg(cmp.B.filter(d=>d.rs.length).map(d=>d.total)),dl=a7-b7;
 return`<div class=seg><button class="btn ${range===7?'':'ghost'} sm" onclick="range=7;render()">7 днів</button><button class="btn ${range===30?'':'ghost'} sm" onclick="range=30;render()">30 днів</button></div>
 <div class=grid>${card('Сон за добу (середнє)',fd(avg(h.map(d=>d.total))))}${card('Нічний сон (середнє)',dn.length?fd(avg(dn.map(d=>d.night))):'—')}${card('Денний сон за добу',nz.length?fd(avg(nz.map(d=>d.nap))):'—')}${card('Денних снів за добу',nz.length?avg(h.map(d=>d.napN)).toFixed(1):'—')}${card('Середній один сон',sl.length?fd(avg(sl.map(r=>dur(r)))):'—')}${card('Середнє неспання',gp.length?fd(avg(gp.map(g=>g.w))):'—')}${card('Час засинання (ніч)',bed.length?clk(avg(bed)):'—')}${card('Час пробудження',wk.length?clk(avg(wk)):'—')}</div>
 <div class=card><h3>Динаміка за ${range} днів</h3><p class=mute>Фіолетове — ніч, персикове — день. Зелена смуга — орієнтовний діапазон для віку (WHO/AASM). Натисніть на стовпчик.</p>${chartTotals(range)}<p id=tip class=note>&nbsp;</p></div>
 <div class=card><h3>Поточний тиждень і попередній</h3>${cmp.svg}<p class=mute>${isNaN(dl)||!b7?'Для порівняння потрібні записи за попередній тиждень.':`У середньому за добу: ${fd(a7)} проти ${fd(b7)} — ${Math.abs(dl)<15*MIN?'майже без змін':(dl>0?'більше':'менше')+' на '+fd(Math.abs(dl))}.`}</p><p class=note>Сірі стовпчики — попередні 7 днів, кольорові — останні 7.</p></div>
 ${vHabits()}${norms()}`}
function norms(){const m=ageM(),t=interp(TOTAL,m)[0],p=interp(PRACT,m),f=a=>a.map(x=>Math.round(x)).join('–');
 return`<div class=card><h3>Вікові орієнтири (${age(cur().birth).m} міс.)</h3><p><b>Підтверджено джерелами:</b> загальний сон за добу, включно з денним, — ${f(t)} год.${m<4?' До 4 міс. це лише рекомендація WHO: AASM не дає норм для цього віку через велику природну мінливість.':''}</p><p><b>Описові дані (Galland 2012):</b> середня тривалість сну ≈ 12,8 год для немовлят (діапазон ±1,96 SD: 9,7–15,9 год) і 11,9 год (9,9–13,8) для 2–5 років. Вихід за ці межі не обов’язково проблема, але привід порадитися з лікарем.</p><p><b>Орієнтовні припущення, не норма:</b> вікно неспання ${f(p[0])} хв; денних снів ${f(p[1])}; нічний сон ${f(p[2])} год. Вікна неспання за віком не мають перевіреної наукової бази: педіатричні сомнологи (напр. д-р К. Канапарі, Yale Pediatric Sleep Center, у матеріалі Romper) зазначають, що їх не досліджували як такі. Це усереднені практичні орієнтири.</p><p class=note>Джерела: WHO, Guidelines on physical activity, sedentary behaviour and sleep for children under 5 years of age (2019): 0–3 міс. 14–17 год, 4–11 міс. 12–16 год, 1–2 роки 11–14 год. Paruthi S. et al., AASM consensus statement, J Clin Sleep Med 2016;12(6):785–786: 4–12 міс. 12–16 год, 1–2 роки 11–14 год, 3–5 років 10–13 год (з денним сном). Galland B.C. et al., Sleep Med Rev 2012;16(3):213–222 (мета-аналіз 34 досліджень за щоденниками й анкетами). Значення між віковими групами — лінійна інтерполяція. Діти індивідуальні; з питаннями про здоров’я звертайтеся до педіатра.</p></div>`}

/* ---- Поради ---- */
const conf=n=>n>=5?'високий':n>=3?'середній':'низький';
function advice(){const h7=hist(7),h30=hist(30);if(h7.length<3)return null;const A=[],tr=interp(TOTAL,ageM())[0],SRC='WHO 2019; AASM, Paruthi et al. 2016',pr=interp(PRACT,ageM());
 const a7=avg(h7.map(d=>d.total))/H,pos=a7<tr[0]?'нижче':a7>tr[1]?'вище':'у межах';
 A.push({n:`Середній сон за добу — ${a7.toFixed(1)} год, це ${pos} орієнтовного діапазону ${tr[0].toFixed(0)}–${tr[1].toFixed(0)} год.`,d:`${h7.length} дн. із записами за останні 7; за 30 днів середнє — ${(avg(h30.map(d=>d.total))/H).toFixed(1)} год.`,w:pos==='нижче'?'Можливо, частина снів не записана, або малюк має меншу індивідуальну потребу.':pos==='вище'?'Можливо, малюк наздоганяє сон або має більшу потребу.':'Тривалість сну збігається з орієнтирами для віку.',t:pos==='у межах'?'Продовжуйте спостерігати за самопочуттям і настроєм малюка.':'Перевірте, чи всі сни записані. Якщо вас турбує самопочуття дитини — обговоріть це з педіатром.',c:conf(h7.length),s:SRC});
 const s7=sd(h7.map(d=>d.total))/H;
 A.push({n:s7>1.5?`Тривалість сну помітно коливається від доби до доби (розкид ≈ ${s7.toFixed(1)} год).`:`Тривалість сну за добу доволі стабільна (розкид ≈ ${s7.toFixed(1)} год).`,d:`Стандартне відхилення добового сну за ${h7.length} дн.`,w:s7>1.5?'Коливання можуть бути пов’язані з розпорядком, самопочуттям, зубками чи неповними записами (припущення).':'Стабільність зазвичай говорить про усталений ритм.',t:s7>1.5?'Спробуйте тримати схожий час підйому й відбою кілька днів поспіль.':'Підтримуйте звичний розпорядок.',c:conf(h7.length),s:'Власні дані; поріг 1,5 год — умовний'});
 const g=gaps(Date.now()-7*DAY).filter(x=>x.next==='day'||x.next==='night'),lo=pr[0][0]*.75*MIN,hi=pr[0][1]*1.25*MIN;
 if(g.length>=4){const hiN=g.filter(x=>x.w>hi).length,loN=g.filter(x=>x.w<lo).length,sh=Math.max(hiN,loN)/g.length;
  A.push({n:sh>.4?(hiN>=loN?'Періоди неспання нерідко довші за орієнтовні для віку.':'Періоди неспання нерідко коротші за орієнтовні для віку.'):'Періоди неспання здебільшого в межах орієнтовних для віку.',d:`${g.length} періодів неспання за 7 днів; ${hiN} довших і ${loN} коротших за межі ±25% від орієнтира.`,w:'Орієнтири неспання — узагальнені практичні припущення, а не наукова норма; у вашої дитини може бути свій ритм (припущення).',t:sh>.4?'Спробуйте кілька днів подивитися на ознаки втоми та покласти малюка на 10–15 хв раніше (або пізніше).':'Нічого змінювати не потрібно.',c:g.length>=8?'середній':'низький',s:'Орієнтовне припущення (практичні орієнтири)'})}
 const pr2=h30.filter(d=>d.bed&&d.nap);
 if(pr2.length>=5){const r=corr(pr2.map(d=>d.nap),pr2.map(d=>bedMin(d.bed)));
  A.push({n:Math.abs(r)>.5?`Є зв’язок між денним сном і часом нічного засинання: ${r<0?'після коротшого денного сну малюк засинає раніше':'після довшого денного сну малюк засинає пізніше'}.`:'Чіткого зв’язку між тривалістю денного сну й часом нічного засинання не видно.',d:`${pr2.length} діб; коефіцієнт кореляції ≈ ${r.toFixed(2)}.`,w:'Збіг подій не доводить причину; може бути випадковістю.',t:Math.abs(r)>.5?'Поспостерігайте ще тиждень, чи повторюється закономірність.':'Додаткових дій не потрібно.',c:'низький',s:'Власні дані, без наукового джерела'})}
 const b30=h30.filter(d=>d.bed).map(d=>bedMin(d.bed));
 if(b30.length>=3){const s=sd(b30);A.push({n:s>45?`Час нічного засинання «пливе» (розкид ≈ ${Math.round(s)} хв).`:`Час нічного засинання стабільний (розкид ≈ ${Math.round(s)} хв).`,d:`${b30.length} ночей за 30 днів; середній час — ${clk(avg(b30))}.`,w:s>45?'Може залежати від останнього денного сну, активності або розпорядку (припущення).':'Усталений відбій допомагає режиму.',t:s>45?'Орієнтуйтеся на ознаки сонливості та тримайте схожий вечірній ритуал.':'Так тримати.',c:conf(b30.length),s:'Власні дані; поріг 45 хв — умовний'})}
 const pv=days(14).slice(0,7).map(dayStats).filter(d=>d.rs.length);
 if(pv.length>=3){const p=sd(pv.map(d=>d.total))/H;A.push({n:s7<p-.3?'Режим стабілізується: коливання сну стали меншими, ніж тиждень тому.':s7>p+.3?'Коливання сну зросли порівняно з попереднім тижнем.':'Стабільність режиму майже не змінилась порівняно з попереднім тижнем.',d:`Розкид зараз ≈ ${s7.toFixed(1)} год, раніше ≈ ${p.toFixed(1)} год (${pv.length} дн.).`,w:'Зміни можуть бути пов’язані з віком, хворобою чи подорожами (припущення).',t:'Продовжуйте спостереження — висновки надійніші на довшому проміжку.',c:conf(Math.min(pv.length,h7.length)),s:'Власні дані'})}
 A.push(...habitAdvice());return A}
function vTips(){const A=advice();if(!A)return`<div class=card><h3>Поки замало даних</h3><p class=mute>Для порад потрібні записи щонайменше за 3 дні. Продовжуйте вести щоденник.</p></div>`+(recs().length?'':emptyHint)+safety();

/* ---- Планувальник ---- */
function genPlan(){const h=hist(7),w=wwEst().ms/MIN,k=Math.round(avg(interp(PRACT,ageM())[1])),wk=h.filter(d=>d.wake).map(d=>mins(d.wake)),nz=h.filter(d=>d.napN),nl=nz.length?avg(nz.map(d=>d.nap/d.napN))/MIN:60,bd=h.filter(d=>d.bed).map(d=>bedMin(d.bed));
 let t=wk.length?avg(wk):420;const it=[];for(let i=0;i<k;i++){t+=w;it.push({id:uid(),t:clk(t),type:'day'});t+=nl}
 let b=bd.length?avg(bd):t+w;b=Math.min(Math.max(b,1110),1290);it.push({id:uid(),t:clk(b),type:'night'});S.plans[S.active]=it;save();render()}
function planT(id,v){const i=S.plans[S.active].find(x=>x.id===id);if(v){i.t=v;save();render()}}
function planDel(id){S.plans[S.active]=S.plans[S.active].filter(x=>x.id!==id);save();render()}
function planAdd(){(S.plans[S.active]=S.plans[S.active]||[]).push({id:uid(),t:'12:00',type:'day'});save();render()}
function vPlan(){const P=(S.plans[S.active]||[]).slice().sort((a,b)=>a.t.localeCompare(b.t)),pd=predict(),td=recs().filter(r=>r.start>=+midnight(Date.now()));

/* ================= Хмарна синхронізація (Firebase Auth + Firestore) =================
   Модель: кожен профіль (c), запис сну (s) і план (p) — окремий документ families/{uid}/items/{c|s|p}:{id}.
   Локальні зміни виявляються автоматично (reconcile), перемагає пізніша зміна (upd), видалення — «надгробки».
   Працює й без хмари: усе спершу зберігається на пристрої, а в хмару йде, коли є зв’язок. */
const FB_URL='https://www.gstatic.com/firebasejs/10.12.2/';
const h53=s=>{let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}
 a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)};
let Y={uid:null,since:0,items:{}}; // стан синхронізації: items[ключ]={h:хеш вмісту, upd, del, pushed:upd, що вже в хмарі}
const pendingCount=()=>Object.keys(Y.items).filter(k=>Y.items[k].upd>Y.items[k].pushed).length;
function flat(T){const m=new Map();T.children.forEach(c=>m.set('c:'+c.id,c));T.sleeps.forEach(r=>m.set('s:'+r.id,r));Object.keys(T.plans||{}).forEach(k=>m.set('p:'+k,T.plans[k]));return m}
/* Порівнює дані з останнім відомим станом: нове/змінене отримує свіжий upd, зникле стає «надгробком». */
function reconcile(T,I,now=Date.now()){const cur=flat(T);let n=0;
 cur.forEach((o,k)=>{const h=h53(JSON.stringify(o)),e=I[k];if(!e||e.del||e.h!==h){I[k]={h,upd:Math.max(now,e?e.upd+1:0),del:false,pushed:e?e.pushed:0};n++}});
 for(const k in I){if(!I[k].del&&!cur.has(k)){I[k]={h:'',upd:Math.max(now,I[k].upd+1),del:true,pushed:I[k].pushed};n++}}
 return n}
/* Застосовує документи з хмари: новіший upd перемагає. Повертає кількість змін. */
function applyBatch(T,I,docs){let n=0;const cm=new Map(T.children.map(c=>[c.id,c])),sm=new Map(T.sleeps.map(r=>[r.id,r]));
 for(const d of docs){const k=d.k+':'+d.id,e=I[k],lu=e?e.upd:0;
  if(d.upd<lu)continue;
  if(d.upd===lu){if(e&&!!e.del===!!d.del)e.pushed=Math.max(e.pushed,d.upd);continue}
  if(!['c','s','p'].includes(d.k))continue;
  let o=null;if(!d.del){try{o=JSON.parse(d.json)}catch(x){continue}}
  if(d.k==='c'){d.del?cm.delete(d.id):cm.set(d.id,o)}else if(d.k==='s'){d.del?sm.delete(d.id):sm.set(d.id,o)}else{if(d.del)delete T.plans[d.id];else T.plans[d.id]=o}
  I[k]={h:d.del?'':h53(JSON.stringify(o)),upd:d.upd,del:!!d.del,pushed:d.upd};n++}
 if(n){T.children=[...cm.values()];T.sleeps=[...sm.values()]}
 return n}

  <p class=note>На іншому пристрої відкрийте це посилання й увійдіть з тією самою поштою та паролем. Налаштування Firebase у посиланні не є секретом: дані захищають пароль і правила бази.</p>
  <div class=row><button class="btn ghost sm" onclick="Sync.push()">Синхронізувати зараз</button><button class="btn ghost sm" onclick="Sync.resync()">Перечитати все з хмари</button></div>
  <div class=row><button class="btn ghost sm" onclick="Sync.logout()">Вийти</button><button class="btn ghost sm" onclick="Sync.reset()">Скинути підключення</button></div>
  <div class=row>${close}</div>`}
 modal(`<div id=syncbox><h2>☁️ Синхронізація</h2>${b}</div>`)}

/* ================= Налаштування і самоперевірка ================= */
function modal(h){$('#mbox').innerHTML=h;$('#modal').classList.add('on')}
function closeM(){$('#modal').classList.remove('on')}
$('#modal').onclick=e=>{if(e.target.id==='modal'&&S.children.length)closeM()};
$('#who').onchange=e=>setChild(e.target.value);
function settings(){modal(`<h2>Налаштування</h2><h3>Профілі</h3>${S.children.map(c=>`<div class=row><span style="flex:2;align-self:center">${esc(c.name)} · ${age(c.birth).m} міс.</span><button class="btn ghost sm" onclick="childModal('${c.id}')">Змінити</button><button class="btn ghost sm" onclick="delChild('${c.id}')">Видалити</button></div>`).join('')}<div class=row><button class="btn sm" onclick="childModal()">＋ Додати дитину</button></div>
 <h3>Тема</h3><div class=row><button class="btn ghost sm" onclick="setTheme('light')">☀️ Світла</button><button class="btn ghost sm" onclick="setTheme('dark')">🌙 Темна</button><button class="btn ghost sm" onclick="setTheme('night')">🕯️ Нічна</button></div>
 <h3>Нагадування</h3><div class=row><button class="btn ghost sm" onclick="enableNotify()">${S.notify?'✓ Увімкнено':'Увімкнути нагадування про сон'}</button></div><p class=note>Показуються за ~10 хв до орієнтовного часу, якщо вкладка відкрита й браузер дозволяє.</p>
 <h3>Синхронізація</h3><div class=row><button class="btn ghost sm" onclick="syncModal()">☁️ ${Sync.st==='off'?'Підключити хмару':Sync.st==='online'?'Підключено ✓':'Стан синхронізації'}</button></div><h3>Дані</h3><div class=row><button class="btn ghost sm" onclick="expJSON()">Резервна копія (JSON)</button><button class="btn ghost sm" onclick="expCSV()">Експорт CSV</button><button class="btn ghost sm" onclick="$('#imp').click()">Імпорт копії</button></div><p class=note>${S.lastBackup?'Остання копія: '+new Date(S.lastBackup).toLocaleString('uk-UA'):'Копій ще не було.'} ${Sync.st==='off'?'Дані зберігаються лише у цьому браузері.':'Дані синхронізуються через хмару; копія є й на цьому пристрої.'}</p>
 <div class=row><button class="btn ghost sm" onclick="aiModal()">🤖 ШІ-аналіз</button><button class="btn ghost sm" onclick="demo()" ${S.active?'':'disabled'}>Додати демо-дані</button><button class="btn ghost sm" onclick="runTests()">Самоперевірка</button><button class="btn ghost sm" onclick="clearAll()">Очистити все</button></div>
 ${Sync.st==='off'?'':'<p class=note>Увага: видалення запису, профілю чи «Очистити все» діє на всіх підключених пристроях.</p>'}<div class=row><button class=btn onclick=closeM()>Закрити</button></div>`)}
async function runTests(){const out=[],T=async(n,f)=>{try{const r=await f();out.push([n,r===true,r===true?'':String(r)])}catch(e){out.push([n,false,e.message])}};
 const R=(s,e,t='day')=>({start:s,end:e,type:t});
 await T('1. Сон 22:00 → 07:00 наступного дня = 9 год',()=>dur(R(new Date(2026,0,10,22).getTime(),new Date(2026,0,11,7).getTime()))===9*H||'Не 9 годин');
 await T('2. Два денні сни коректно додаються',()=>total([R(0,90*MIN),R(5*H,5*H+45*MIN)])===135*MIN||'Сума неправильна');
 await T('3. Дані переживають перезавантаження (нове підключення до сховища)',async()=>{await DB.set('__t',{a:42});if(DB.idb)DB.idb.close();await DB.init();const v=await DB.get('__t');await DB.set('__t',null);return(v&&v.a===42)||'Дані не збереглися'});
 await T('4. Експорт JSON → імпорт відновлює дані',()=>{const cid=uid(),src={app:'sleep-baby',version:1,children:[{id:cid,name:'Тест',birth:'2026-01-01'}],sleeps:[{id:uid(),cid,start:1e12,end:1e12+9*H,type:'night',fall:'self',note:'тест'},{id:uid(),cid,start:1e12+12*H,end:null,type:'day'}],plans:{}};
  const d=validate(JSON.parse(JSON.stringify(src))),t={children:[],sleeps:[],plans:{}},r=mergeInto(t,d),r2=mergeInto(t,d);
  return(r.c===1&&r.s===2&&t.sleeps[0].end===1e12+9*H&&t.sleeps[0].note==='тест'&&t.sleeps[0].fall==='self'&&t.sleeps[1].end===null&&r2.s===0)||'Відновлення неточне або є дублікати'});
 await T('5. Перехід на літній час (Київ, 28→29 бер. 2026): 22:00 EET → 07:00 EEST = 8 год',()=>{const s=Date.UTC(2026,2,28,20),e=Date.UTC(2026,2,29,4);return dur(R(s,e,'night'))===8*H||'Невірно'});
 await T('6. Синхронізація: новіша правка перемагає, видалення поширюється, повтор не дублює',()=>{
  const A={children:[],sleeps:[],plans:{}},B={children:[],sleeps:[],plans:{}},IA={},IB={},cid='c1';
  const docs=I=>Object.keys(I).map(k=>({k:k[0],id:k.slice(2),upd:I[k].upd,del:I[k].del,json:I[k].del?'':JSON.stringify(flat(I===IA?A:B).get(k))}));
  A.children.push({id:cid,name:'Т',birth:'2026-01-01'});A.sleeps.push({id:'s1',cid,start:1,end:2,type:'day'});A.plans[cid]=[{id:'p',t:'12:00',type:'day'}];reconcile(A,IA,100);
  const d1=docs(IA);applyBatch(B,IB,d1);if(B.children.length!==1||B.sleeps.length!==1||!B.plans[cid])return 'Другий пристрій не отримав дані';
  if(applyBatch(B,IB,d1)!==0)return 'Повторне застосування змінило дані';
  B.sleeps[0].end=5;reconcile(B,IB,200);applyBatch(A,IA,docs(IB));if(A.sleeps[0].end!==5)return 'Нова правка не дійшла';
  if(applyBatch(B,IB,d1)!==0||B.sleeps[0].end!==5)return 'Стара версія перебила нову';
  A.sleeps=[];reconcile(A,IA,300);applyBatch(B,IB,docs(IA));if(B.sleeps.length!==0)return 'Видалення не поширилося';
  return true});
 modal(`<h2>Самоперевірка</h2>${out.map(o=>`<p class="${o[1]?'ok':'bad'}">${o[1]?'✓':'✗'} ${o[0]}${o[2]?' — '+esc(o[2]):''}</p>`).join('')}<p class=note>Час зберігається як точні мітки (мс від 1970 р.), тому літній/зимовий час не впливає на тривалість.</p><div class=row><button class=btn onclick=settings()>Назад</button></div>`)}

/* ================= Старт ================= */
document.addEventListener('click',e=>{const g=e.target.closest('[data-tip]');if(g){const t=$('#tip');if(t)t.textContent=g.dataset.tip}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.tip)e.target.dispatchEvent(new Event('click',{bubbles:true}))});
(async()=>{await DB.init();const s=await DB.get('state');if(s)S=Object.assign(S,s);const y=await DB.get('sync');if(y&&y.items)Y=Object.assign(Y,y);
 if(S.active&&!cur())S.active=S.children[0]?.id||null;document.documentElement.dataset.theme=S.theme;
 reconcile(S,Y.items);DB.set('sync',Y);Sync.importHash();
 render();setInterval(tick,1000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)Sync.push()});
 window.addEventListener('online',()=>{if(Sync.cfg&&!Sync.sdk)Sync.start();else Sync.push()});
 const hasCfg=!!Sync.loadCfg();if(hasCfg)Sync.start();
 let openSync=false;try{openSync=!!sessionStorage.getItem('sb_open');sessionStorage.removeItem('sb_open')}catch(e){}
 if(!S.children.length){if(hasCfg){Sync.welcome=true;syncModal()}else childModal()}else if(hasCfg&&openSync)syncModal()})();
</script>
