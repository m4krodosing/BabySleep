div class=\"task-title\">${escapeHtml(item.name)}<\/div>\n                <div class=\"task-sub\">${item.quantity>1?`x${item.quantity} · `:\"\"}${item.price?item.price.toFixed(2)+\" €\":\"без ціни\"}${member?\" · \"+escapeHtml(member.name):\"\"}<\/div>\n              <\/div>\n              <button class=\"icon-btn\" data-shop-remove=\"${item.id}\" style=\"color:var(--alert);\">✕<\/button>\n            <\/div>\n          `;\n        });\n      });\n    }\n\n    main.innerHTML = html;\n\n    main.querySelectorAll(\"[data-shop-filter]\").forEach(btn => {\n      btn.addEventListener(\"click\", () => {\n        const [key, val] = btn.dataset.shopFilter.split(\":\");\n        shoppingFilters[key] = val;\n        renderShoppingView(main);\n      });\n    });\n    const addBtn = document.getElementById(\"shopAddBtn\");\n    function doAdd(){\n      const name = document.getElementById(\"shopName\").value.trim();\n      if (!name) return;\n      const category = document.getElementById(\"shopCategory\").value;\n      const price = parseFloat(document.getElementById(\"shopPrice\").value) || 0;\n      state.shoppingList.push({\n        id: uid(), name, category, price, quantity: 1, purchased: false,\n        addedBy: state.members[0] ? state.members[0].id : null, addedAt: new Date().toISOString()\n      });\n      persist();\n      renderShoppingView(main);\n    }\n    if (addBtn) addBtn.addEventListener(\"click\", doAdd);\n    const nameInput = document.getElementById(\"shopName\");\n    if (nameInput) nameInput.addEventListener(\"keypress\", (e) => { if (e.key === \"Enter\") doAdd(); });\n\n    main.querySelectorAll(\"[data-shop-toggle]\").forEach(cb => {\n      cb.addEventListener(\"change\", () => {\n        const item = state.shoppingList.find(i => i.id === cb.dataset.shopToggle);\n        if (item) { item.purchased = !item.purchased; persist(); renderShoppingView(main); }\n      });\n    });\n    main.querySelectorAll(\"[data-shop-remove]\").forEach(btn => {\n      btn.addEventListener(\"click\", () => {\n        if (confirm(\"Видалити цю покупку?\")) {\n          state.shoppingList = state.shoppingList.filter(i => i.id !== btn.dataset.shopRemove);\n          persist();\n          renderShoppingView(main);\n        }\n      });\n    });\n  }\n\n  /* ---------- Personal Time / Parent Date Night ---------- */\n  const TIME_TYPES = { Personal: \"👤 Особистий\", Couple: \"❤️ Спільний\", Childcare: \"👶 З дитиною\", Household: \"🏠 Домашні справи\" };\n  let timeSubTab = null;\n\n  function hoursBetween(start, end){\n    if (!start || !end) return 0;\n    const [sh, sm] = start.split(\":\").map(Number);\n    const [eh, em] = end.split(\":\").map(Number);\n    let mins = (eh*60+em) - (sh*60+sm);\n    if (mins < 0) mins += 24*60;\n    return mins/60;\n  }\n  function fmtHours(h){\n    const r = Math.round(h*10)/10;\n    return `${r} год`;\n  }\n  function weekRangeStrs(){\n    const start = startOfWeek(new Date());\n    const end = new Date(start); end.setDate(start.getDate()+6);\n    return { start: fmtDate(start), end: fmtDate(end) };\n  }\n\n  function timeAddBoxHtml(forcedType){\n    return `\n      <div class=\"time-add-box\">\n        <div class=\"time-add-grid\">\n          <input type=\"text\" id=\"timeTitle\" placeholder=\"${forcedType==='Couple' ? \"Наприклад, Вечеря удвох\" : \"Наприклад, Спорт\"}\">\n          ${forcedType ? \"\" : `\n            <select class=\"field-input\" id=\"timeType\">\n              ${Object.keys(TIME_TYPES).map(k => `<option value=\"${k}\">${TIME_TYPES[k]}<\/option>`).join(\"\")}\n            <\/select>\n          `}\n          <input type=\"date\" id=\"timeDate\" value=\"${todayStr()}\">\n          <input type=\"time\" id=\"timeStart\">\n          <input type=\"time\" id=\"timeEnd\">\n        <\/div>\n        <button class=\"btn btn-primary\" id=\"timeAddBtn\" style=\"width:100%;\">+ ${forcedType==='Couple' ? \"Спланувати\" : \"Додати час\"}<\/button>\n      <\/div>\n    `;\n  }\n\n  function attachTimeAddBox(main, person, forcedType, onAdded){\n    const btn = document.getElementById(\"timeAddBtn\");\n    if (!btn) return;\n    btn.addEventListener(\"click\", () => {\n      const title = document.getElementById(\"timeTitle\").value.trim();\n      if (!title) return;\n      const type = forcedType || document.getElementById(\"timeType\").value;\n      const block = {\n        id: uid(),\n        person: type === \"Couple\" ? \"shared\" : person,\n        type,\n        title,\n        date: document.getElementById(\"timeDate\").value || todayStr(),\n        startTime: document.getElementById(\"timeStart\").value.trim(),\n        endTime: document.getElementById(\"timeEnd\").value.trim(),\n        createdAt: new Date().toISOString()\n      };\n      state.timeBlocks.push(block);\n      persist();\n      onAdded();\n    });\n  }\n\n  function timeBlockRowHtml(b, colorVar){\n    const dur = hoursBetween(b.startTime, b.endTime);\n    return `\n      <div class=\"task-row\" style=\"border-left-color:${colorVar};\">\n        <div class=\"body\">\n          <div class=\"task-title\">${escapeHtml(b.title)}<\/div>\n          <div class=\"task-sub\">${formatDateShort(b.date)}${b.startTime?` · ${b.startTime}${b.endTime?\"–\"+b.endTime:\"\"}`:\"\"}${dur?` (${fmtHours(dur)})`:\"\"}<\/div>\n        <\/div>\n        <button class=\"icon-btn\" data-time-remove=\"${b.id}\" style=\"color:var(--alert);\">✕<\/button>\n      <\/div>\n    `;\n  }\n\n  function attachTimeRowRemove(main, onRemoved){\n    main.querySelectorAll(\"[data-time-remove]\").forEach(btn => {\n      btn.addEventListener(\"click\", () => {\n        state.timeBlocks = state.timeBlocks.filter(b => b.id !== btn.dataset.timeRemove);\n        persist();\n        onRemoved();\n      });\n    });\n  }\n\n  function renderTimeView(main){\n    if (!timeSubTab) timeSubTab = state.members[0] ? state.members[0].id : \"daten\";\n\n    let html = `<div class=\"filter-row\">`;\n    state.members.forEach(m => {\n      html += `<button class=\"chip ${timeSubTab===m.id?'active':''}\" data-time-tab=\"${m.id}\">${escapeHtml(m.name)}<\/button>`;\n    });\n    html += `<button class=\"chip ${timeSubTab==='daten'?'active':''}\" data-time-tab=\"daten\">❤️ Date Night<\/button>`;\n    html += `<\/div>`;\n\n    main.innerHTML = html;\n    main.insertAdjacentHTML(\"beforeend\", timeSubTab === \"daten\" ? dateNightBodyHtml() : personTimeBodyHtml(timeSubTab));\n\n    main.querySelectorAll(\"[data-time-tab]\").forEach(btn => {\n      btn.addEventListener(\"click\", () => { timeSubTab = btn.dataset.timeTab; renderTimeView(main); });\n    });\n\n    if (timeSubTab === \"daten\") {\n      attachTimeAddBox(main, \"shared\", \"Couple\", () => renderTimeView(main));\n    } else {\n      attachTimeAddBox(main, timeSubTab, null, () => renderTimeView(main));\n    }\n    attachTimeRowRemove(main, () => renderTimeView(main));\n  }\n\n  function personTimeBodyHtml(memberId){\n    const member = state.members.find(m => m.id === memberId);\n    const { start, end } = weekRangeStrs();\n    const weekBlocks = state.timeBlocks.filter(b => b.date >= start && b.date <= end);\n    const mine = weekBlocks.filter(b => b.person === memberId);\n    const shared = weekBlocks.filter(b => b.person === \"shared\" && b.type === \"Couple\");\n\n    const sum = (arr) => arr.reduce((s,b) => s + hoursBetween(b.startTime, b.endTime), 0);\n    const personalH = sum(mine.filter(b => b.type === \"Personal\"));\n    const childH = sum(mine.filter(b => b.type === \"Childcare\"));\n    const homeH = sum(mine.filter(b => b.type === \"Household\"));\n    const coupleH = sum(shared);\n\n    const upcoming = mine.slice().sort((a,b) => a.date.localeCompare(b.date));\n\n    return `\n      <div class=\"time-stat-grid\">\n        <div class=\"time-stat-card\"><div class=\"stat-label\">👤 Особистий час<\/div><div class=\"stat-value\">${fmtHours(personalH)}<\/div><\/div>\n        <div class=\"time-stat-card\"><div class=\"stat-label\">👶 З дитиною<\/div><div class=\"stat-value\">${fmtHours(childH)}<\/div><\/div>\n        <div class=\"time-stat-card\"><div class=\"stat-label\">🏠 Домашні справи<\/div><div class=\"stat-value\">${fmtHours(homeH)}<\/div><\/div>\n        <div class=\"time-stat-card\"><div class=\"stat-label\">❤️ Спільний час<\/div><div class=\"stat-value\">${fmtHours(coupleH)}<\/div><\/div>\n      <\/div>\n      ${timeAddBoxHtml(null)}\n      <div class=\"section-title\">Цього тижня — ${escapeHtml(member ? member.name : \"\")}<\/div>\n      ${upcoming.length ? upcoming.map(b => timeBlockRowHtml(b, member ? member.color : \"var(--shared)\")).join(\"\") : `<div class=\"empty-note\">Ще немає запланованого часу цього тижня<\/div>`}\n    `;\n  }\n\n  function dateNightBodyHtml(){\n    const today = todayStr();\n    const all = state.timeBlocks.filter(b => b.type === \"Couple\");\n    const upcoming = all.filter(b => b.date >= today).sort((a,b) => a.date.localeCompare(b.date));\n    const past = all.filter(b => b.date < today).sort((a,b) => b.date.localeCompare(a.date));\n\n    const monthPrefix = today.slice(0,7);\n    const monthHours = all.filter(b => b.date.startsWith(monthPrefix)).reduce((s,b) => s + hoursBetween(b.startTime, b.endTime), 0);\n\n    return `\n      <div class=\"dn-hero\">\n        <div class=\"stat-label\">Цього місяця разом<\/div>\n        <div class=\"stat-value\">${fmtHours(monthHours)}<\/div>\n        <div class=\"task-sub\" style=\"margin-top:4px;\">Рекомендація: мінімум 1–2 рази на місяць<\/div>\n      <\/div>\n      ${timeAddBoxHtml(\"Couple\")}\n      <div class=\"section-title\">Заплановано<\/div>\n      ${upcoming.length ? upcoming.map(b => timeBlockRowHtml(b, \"var(--shared)\")).join(\"\") : `<div class=\"empty-note\">Ще нічого не заплановано<\/div>`}\n      ${past.length ? `<div class=\"section-title\">Минулі<\/div>${past.map(b => timeBlockRowHtml(b, \"var(--shared)\")).join(\"\")}` : \"\"}\n    `;\n  }\n\n  /* ---------- Statistics / Weekly Pulse-Check ---------- */\n  let statsPeriod = \"week\";\n  const SIZE_HOURS = { Small: 0.5, Medium: 1, Large: 2.5 };\n\n  function statsPeriodRange(period){\n    if (period === \"month\") {\n      const now = new Date();\n      const first = new Date(now.getFullYear(), now.getMonth(), 1);\n      const last = new Date(now.getFullYear(), now.getMonth()+1, 0);\n      return { start: fmtDate(first), end: fmtDate(last) };\n    }\n    return weekRangeStrs();\n  }\n\n  function renderStatsView(main){\n    const { start, end } = statsPeriodRange(statsPeriod);\n    const periodTasks = state.tasks.filter(t => t.dueDate >= start && t.dueDate <= end);\n    const completed = periodTasks.filter(t => t.status === \"Done\");\n    const overdue = state.tasks.filter(t => t.status !== \"Done\" && t.dueDate < todayStr());\n    const periodBlocks = state.timeBlocks.filter(b => b.date >= start && b.date <= end);\n    const coupleBlocks = periodBlocks.filter(b => b.type === \"Couple\");\n    const coupleHours = coupleBlocks.reduce((s,b) => s + hoursBetween(b.startTime, b.endTime), 0);\n\n    const maxCount = Math.max(1, ...state.members.map(m => completed.filter(t => t.assignedTo === m.id).length));\n\n    let html = `\n      <div class=\"filter-row\">\n        <button class=\"chip ${statsPeriod==='week'?'active':''}\" data-stats-period=\"week\">Цей тиждень<\/button>\n        <button class=\"chip ${statsPeriod==='month'?'active':''}\" data-stats-period=\"month\">Цей місяць<\/button>\n      <\/div>\n      <div class=\"stats-hero\">\n        <div class=\"stat-label\">Разом виконано<\/div>\n        <div class=\"stat-value\">${completed.length}<\/div>\n        <div class=\"task-sub\">${formatDateShort(start)} — ${formatDateShort(end)}<\/div>\n      <\/div>\n\n      <div class=\"section-title\">⚖️ Розподіл виконаних завдань<\/div>\n      ${state.members.map(m => {\n        const mine = completed.filter(t => t.assignedTo === m.id);\n        const hours = mine.reduce((s,t) => s + (SIZE_HOURS[t.size] || 1), 0);\n        const pct = Math.round((mine.length / maxCount) * 100);\n        return `\n          <div class=\"load-bar-row\">\n            <div class=\"load-bar-label\"><span>${escapeHtml(m.name)}<\/span><span>${mine.length} ${plural(mine.length)} · ${fmtHours(hours)}<\/span><\/div>\n            <div class=\"load-bar-track\"><div class=\"load-bar-fill\" style=\"width:${pct}%; background:${m.color};\"><\/div><\/div>\n          <\/div>\n        `;\n      }).join(\"\")}\n\n      <div class=\"section-title\">🗂️ За категоріями<\/div>\n      ${CATEGORIES.map(c => {\n        const n = periodTasks.filter(t => t.category === c).length;\n        return n ? `<div class=\"cat-row\"><span>${categoryLabel(c)}<\/span><span>${n}<\/span><\/div>` : \"\";\n      }).join(\"\") || `<div class=\"empty-note\">Немає завдань за цей період<\/div>`}\n\n      <div class=\"section-title\">🕐 Час без завдань<\/div>\n      <div class=\"time-stat-grid\">\n        ${state.members.map(m => {\n          const mine = periodBlocks.filter(b => b.person === m.id);\n          const personalH = mine.filter(b => b.type === \"Personal\").reduce((s,b) => s + hoursBetween(b.startTime,b.endTime), 0);\n          const childH = mine.filter(b => b.type === \"Childcare\").reduce((s,b) => s + hoursBetween(b.startTime,b.endTime), 0);\n          return `\n            <div class=\"time-stat-card\">\n              <div class=\"stat-label\">👤 ${escapeHtml(m.name)} — особистий<\/div>\n              <div class=\"stat-value\">${fmtHours(personalH)}<\/div>\n            <\/div>\n            <div class=\"time-stat-card\">\n              <div class=\"stat-label\">👶 ${escapeHtml(m.name)} — з дитиною<\/div>\n              <div class=\"stat-value\">${fmtHours(childH)}<\/div>\n            <\/div>\n          `;\n        }).join(\"\")}\n        <div class=\"time-stat-card\" style=\"grid-column:1/-1;\">\n          <div class=\"stat-label\">❤️ Спільний час (Date Night)<\/div>\n          <div class=\"stat-value\">${fmtHours(coupleHours)}${coupleBlocks.length ? \"\" : \" · ще не заплановано\"}<\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"section-title\" style=\"color:${overdue.length?'var(--alert)':'inherit'}\">⚠️ Прострочені завдання (${overdue.length})<\/div>\n      ${overdue.length ? overdue.slice(0,6).map(t => taskRowHtml(t, state.members.find(m => m.id === t.assignedTo), true)).join(\"\") : `<div class=\"empty-note\">Прострочених немає 🎉<\/div>`}\n    `;\n\n    main.innerHTML = html;\n    attachTaskRowEvents(main);\n    main.querySelectorAll(\"[data-stats-period]\").forEach(btn => {\n      btn.addEventListener(\"click\", () => { statsPeriod = btn.dataset.statsPeriod; renderStatsView(main); });\n    });\n  }\n\n  /* ---------- Payments ---------- */\n  const PAYMENT_CATEGORIES = [\"Utilities\",\"Rent\",\"Insurance\",\"Internet\",\"Phone\",\"Other\"];\n  function paymentCategoryLabel(cat){\n    const map = { Utilities: \"⚡ Комунальні\", Rent: \"🏠 Оренда\", Insurance: \"🛡️ Страхування\", Internet: \"🌐 Інтернет\", Phone: \"📱 Телефон\", Other: \"📦 Інше\" };\n    return map[cat] || cat;\n  }\n  const PAYMENT_FREQ_LABELS = { Monthly: \"Щомісяця\", Quarterly: \"Щокварталу\", Annually: \"Щороку\", OneTime: \"Один раз\" };\n  let paymentFilters = { status: \"all\" };\n\n  function nextPaymentDate(dateStr, frequency){\n    const d = new Date(dateStr + \"T00:00:00\");\n    if (frequency === \"Monthly\") d.setMonth(d.getMonth()+1);\n    else if (frequency === \"Quarterly\") d.setMonth(d.getMonth()+3);\n    else if (frequency === \"Annually\") d.setFullYear(d.getFullYear()+1);\n    else return null;\n    return fmtDate(d);\n  }\n\n  function renderPaymentsView(main){\n    let list = state.payments.slice();\n    if (paymentFilters.status === \"unpaid\") list = list.filter(p => !p.isPaid);\n    else if (paymentFilters.status === \"paid\") list = list.filter(p => p.isPaid);\n    list.sort((a,b) => a.dueDate.localeCompare(b.dueDate));\n\n    const unpaidTotal = state.payments.filter(p => !p.isPaid).reduce((s,p) => s + (p.amount||0), 0);\n    const monthPrefix = todayStr().slice(0,7);\n    const paidThisMonth = state.payments.filter(p => p.isPaid && p.dueDate.startsWith(monthPrefix)).reduce((s,p) => s + (p.amount||0), 0);\n\n    let html = `\n      <div class=\"stat-grid\">\n        <div class=\"stat-card\"><div class=\"stat-label\">До сплати<\/div><div class=\"stat-value\" style=\"color:var(--alert);\">${unpaidTotal.toFixed(2)} €<\/div><\/div>\n        <div class=\"stat-card\"><div class=\"stat-label\">Сплачено цього міс.<\/div><div class=\"stat-value\" style=\"color:var(--p1);\">${paidThisMonth.toFixed(2)} €<\/div><\/div>\n        <div class=\"stat-card\"><div class=\"stat-label\">Записів<\/div><div class=\"stat-value\">${state.payments.length}<\/div><\/div>\n      <\/div>\n      <div class=\"filter-row\">\n        <button class=\"chip ${paymentFilters.status==='all'?'active':''}\" data-pay-filter=\"all\">Усі<\/button>\n        <button class=\"chip ${paymentFilters.status==='unpaid'?'active':''}\" data-pay-filter=\"unpaid\">Не сплачено<\/button>\n        <button class=\"chip ${paymentFilters.status==='paid'?'active':''}\" data-pay-filter=\"paid\">Сплачено<\/button>\n      <\/div>\n      <div class=\"shop-add-box\">\n        <div class=\"shop-add-grid\">\n          <input type=\"text\" id=\"payTitle\" placeholder=\"Наприклад, Електроенергія\">\n          <select class=\"field-input\" id=\"payCategory\">${PAYMENT_CATEGORIES.map(c => `<option value=\"${c}\">${paymentCategoryLabel(c)}<\/option>`).join(\"\")}<\/select>\n          <input type=\"number\" id=\"payAmount\" placeholder=\"Сума €\" step=\"0.01\" min=\"0\" class=\"field-input\">\n          <input type=\"date\" id=\"payDueDate\" value=\"${todayStr()}\">\n          <select class=\"field-input\" id=\"payFrequency\">${Object.keys(PAYMENT_FREQ_LABELS).map(f => `<option value=\"${f}\">${PAYMENT_FREQ_LABELS[f]}<\/option>`).join(\"\")}<\/select>\n          <select class=\"field-input\" id=\"payResponsible\">${state.members.map(m => `<option value=\"${m.id}\">${escapeHtml(m.name)}<\/option>`).join(\"\")}<\/select>\n        <\/div>\n        <button class=\"btn btn-primary\" id=\"payAddBtn\" style=\"width:100%;\">+ Додати платіж<\/button>\n      <\/div>\n    `;\n\n    if (!list.length) {\n      html += `<div class=\"empty-note\">Немає платежів за цим фільтром<\/div>`;\n    } else {\n      list.forEach(p => {\n        const member = state.members.find(m => m.id === p.responsible);\n        const overduePay = !p.isPaid && p.dueDate < todayStr();\n        html += `\n          <div class=\"shopping-item-row ${p.isPaid?'purchased':''}\" style=\"${overduePay ? 'border-color:var(--alert);' : ''}\">\n            <input type=\"checkbox\" ${p.isPaid?'checked':''} data-pay-toggle=\"${p.id}\">\n            <div class=\"body\">\n              <div class=\"task-title\">${escapeHtml(p.title)}<\/div>\n              <div class=\"task-sub\">${paymentCategoryLabel(p.category)} · ${p.amount?p.amount.toFixed(2)+\" € · \":\"\"}до ${formatDateShort(p.dueDate)}${member?\" · \"+escapeHtml(member.name):\"\"}${p.frequency!==\"OneTime\"?\" · 🔁 \"+PAYMENT_FREQ_LABELS[p.frequency]:\"\"}<\/div>\n            <\/div>\n            <button class=\"icon-btn\" data-pay-remove=\"${p.id}\" style=\"color:var(--alert);\">✕<\/button>\n          <\/div>\n        `;\n      });\n    }\n\n    main.innerHTML = html;\n\n    main.querySelectorAll(\"[data-pay-filter]\").forEach(btn => {\n      btn.addEventListener(\"click\", () => { paymentFilters.status = btn.dataset.payFilter; renderPaymentsView(main); });\n    });\n    document.getElementById(\"payAddBtn\").addEventListener(\"click\", () => {\n      const title = document.getElementById(\"payTitle\").value.trim();\n      if (!title) return;\n      state.payments.push({\n        id: uid(),\n        title,\n        amount: parseFloat(document.getElementById(\"payAmount\").value) || 0,\n        category: document.getElementById(\"payCategory\").value,\n        dueDate: document.getElementById(\"payDueDate\").value || todayStr(),\n        frequency: document.getElementById(\"payFrequency\").value,\n        responsible: document.getElementById(\"payResponsible\").value || null,\n        isPaid: false,\n        createdAt: new Date().toISOString()\n      });\n      persist();\n      renderPaymentsView(main);\n    });\n    main.querySelectorAll(\"[data-pay-toggle]\").forEach(cb => {\n      cb.addEventListener(\"change\", () => {\n        const p = state.payments.find(x => x.id === cb.dataset.payToggle);\n        if (!p) return;\n        p.isPaid = !p.isPaid;\n        if (p.isPaid && p.frequency !== \"OneTime\") {\n          const nextDate = nextPaymentDate(p.dueDate, p.frequency);\n          if (nextDate) {\n            state.payments.push({ ...p, id: uid(), dueDate: nextDate, isPaid: false, createdAt: new Date().toISOString() });\n          }\n        }\n        persist();\n        renderPaymentsView(main);\n      });\n    });\n    main.querySelectorAll(\"[data-pay-remove]\").forEach(btn => {\n      btn.addEventListener(\"click\", () => {\n        if (confirm(\"Видалити цей платіж?\")) {\n          state.payments = state.payments.filter(x => x.id !== btn.dataset.payRemove);\n          persist();\n          renderPaymentsView(main);\n        }\n      });\n    });\n  }\n\n  /* ---------- Settings (minimal for now) ---------- */\n  function renderSettings(main){\n    main.innerHTML = `\n      <div class=\"link-card\" id=\"openStatsCard\">\n        <div><div class=\"task-title\">📊 Статистика та тижневий підсумок<\/div><div class=\"task-sub\">Розподіл навантаження, категорії, прострочене<\/div><\/div>\n        <span class=\"arrow\">›<\/span>\n      <\/div>\n      <div class=\"link-card\" id=\"openPaymentsCard\">\n        <div><div class=\"task-title\">💰 Платежі та рахунки<\/div><div class=\"task-sub\">Комунальні, оренда, страхування — з нагадуваннями<\/div><\/div>\n        <span class=\"arrow\">›<\/span>\n      <\/div>\n\n      <div class=\"section-title\">👥 Члени сім'ї<\/div>\n      ${state.members.map(m => `\n        <div class=\"task-row clickable\" style=\"border-left-color:${m.color};\" data-edit-member=\"${m.id}\">\n          <div class=\"body\"><div class=\"task-title\">${escapeHtml(m.name)}<\/div><div class=\"task-sub\">${m.role === 'partner1' ? 'Партнер 1' : m.role === 'partner2' ? 'Партнер 2' : 'Член сім’ї'}<\/div><\/div>\n        <\/div>\n      `).join(\"\")}\n      <button class=\"link-btn\" id=\"addMemberBtn\" style=\"margin-bottom:14px;\">+ Додати члена сім'ї<\/button>\n\n      <div class=\"section-title\">👶 Діти<\/div>\n      ${state.children.map(c => `\n        <div class=\"task-row clickable\" style=\"border-left-color:var(--child);\" data-edit-child=\"${c.id}\">\n          <div class=\"body\"><div class=\"task-title\">${escapeHtml(c.name)}<\/div><div class=\"task-sub\">${c.birthdate ? \"Народж.: \" + c.birthdate : \"Дитина\"}<\/div><\/div>\n        <\/div>\n      `).join(\"\")}\n      <button class=\"link-btn\" id=\"addChildBtnSettings\" style=\"margin-bottom:6px;\">+ Додати дитину<\/button>\n\n\n      <div class=\"section-title\">💾 Дані<\/div>\n      <button class=\"btn btn-ghost\" id=\"exportBtn\" style=\"padding-left:0;\">📥 Експортувати дані (.json)<\/button>\n      <br>\n      <button class=\"btn btn-ghost\" id=\"resetBtn\" style=\"color:var(--alert); padding-left:0;\">🗑 Очистити всі дані<\/button>\n    `;\n\n    document.getElementById(\"openStatsCard\").onclick = () => { currentView = \"stats\"; renderShell(); };\n    document.getElementById(\"openPaymentsCard\").onclick = () => { currentView = \"payments\"; renderShell(); };\n\n    main.querySelectorAll(\"[data-edit-member]\").forEach(el => {\n      el.addEventListener(\"click\", () => openMemberForm(state.members.find(m => m.id === el.dataset.editMember)));\n    });\n    document.getElementById(\"addMemberBtn\").onclick = () => openMemberForm(null);\n\n    main.querySelectorAll(\"[data-edit-child]\").forEach(el => {\n      el.addEventListener(\"click\", () => openChildForm(state.children.find(c => c.id === el.dataset.editChild)));\n    });\n    document.getElementById(\"addChildBtnSettings\").onclick = () => openChildForm(null);\n\n    main.querySelectorAll(\"[data-theme-choice]\").forEach(btn => {\n      btn.addEventListener(\"click\", () => {\n        state.family.theme = btn.dataset.themeChoice;\n        persist();\n        applyTheme();\n        renderSettings(main);\n      });\n    });\n\n    document.getElementById(\"exportBtn\").onclick = async () => {\n      const dataStr = JSON.stringify(state, null, 2);\n      try {\n        const a = document.createElement(\"a\");\n        a.href = URL.createObjectURL(new Blob([dataStr], { type: \"application/json\" }));\n        a.download = \"sim-ya-\" + todayStr() + \".json\";\n        document.body.appendChild(a); a.click(); a.remove();\n        setTimeout(() => URL.revokeObjectURL(a.href), 2000);\n        return;\n        const downloads = await window.claude.use(\"downloads\");\n        if (!downloads) throw { code: \"unavailable\" };\n        await downloads.save({ filename: \"family-organizer-data.json\", data: dataStr });\n      } catch (e) {\n        if (e && e.code === \"declined\") return;\n        alert(\"Не вдалося зберегти файл у цьому перегляді. Спробуйте відкрити додаток за посиланням і повторити.\");\n      }\n    };\n\n    document.getElementById(\"resetBtn\").onclick = () => {\n      if (confirm(\"Видалити всі дані додатку? Це не можна скасувати.\")) {\n        state = { family: {name:\"\", theme:\"auto\", createdAt: new Date().toISOString()}, members: [], children: [], tasks: [], shoppingList: [], payments: [], timeBlocks: [] };\n        persist();\n        onbStep = 0;\n        onbDraft = { p1: {name:\"\", color: PARTNER_COLORS[0]}, p2: {name:\"\", color: PARTNER_COLORS[1]}, children: [] };\n        render();\n      }\n    };\n  }\n\n  function openMemberForm(existingMember){\n    const isEdit = !!existingMember;\n    const m = existingMember || { name: \"\", color: PARTNER_COLORS[state.members.length % PARTNER_COLORS.length] };\n    const backdrop = document.createElement(\"div\");\n    backdrop.className = \"sheet-backdrop\";\n    backdrop.innerHTML = `\n      <div class=\"sheet\">\n        <h3>${isEdit ? \"Редагувати члена сім'ї\" : \"Новий член сім'ї\"}<\/h3>\n        <div class=\"field\">\n          <label>Ім'я<\/label>\n          <input type=\"text\" id=\"memName\" value=\"${escapeHtml(m.name)}\">\n        <\/div>\n        <div class=\"field\">\n          <label>Колір<\/label>\n          <div class=\"color-row\" id=\"memColorRow\">\n            ${PARTNER_COLORS.map(c => `<button type=\"button\" class=\"color-swatch ${c===m.color?'selected':''}\" data-color=\"${c}\" style=\"background:${c}\"><\/button>`).join(\"\")}\n          <\/div>\n        <\/div>\n        <div class=\"btn-row\">\n          <button class=\"btn btn-ghost\" id=\"cancelMem\">Скасувати<\/button>\n          <button class=\"btn btn-primary\" id=\"saveMem\">Зберегти<\/button>\n        <\/div>\n        ${isEdit ? `<button class=\"btn btn-danger-ghost\" id=\"deleteMem\" style=\"width:100%; margin-top:10px;\">🗑 Видалити<\/button>` : \"\"}\n      <\/div>\n    `;\n    document.body.appendChild(backdrop);\n    let chosenColor = m.color;\n    backdrop.querySelectorAll(\"[data-color]\").forEach(btn => {\n      btn.addEventListener(\"click\", () => {\n        chosenColor = btn.dataset.color;\n        backdrop.querySelectorAll(\"[data-color]\").forEach(b => b.classList.toggle(\"selected\", b === btn));\n      });\n    });\n    document.getElementById(\"cancelMem\").onclick = () => backdrop.remove();\n    document.getElementById(\"saveMem\").onclick = () => {\n      const name = document.getElementById(\"memName\").value.trim();\n      if (!name) return;\n      if (isEdit) {\n        existingMember.name = name;\n        existingMember.color = chosenColor;\n      } else {\n        state.members.push({ id: uid(), name, color: chosenColor, role: \"member\" });\n      }\n      persist();\n      backdrop.remove();\n      renderView();\n    };\n    if (isEdit) {\n      document.getElementById(\"deleteMem\").onclick = () => {\n        if (state.members.length <= 1) {\n          alert(\"У сім'ї має залишитись щонайменше один член. Спочатку додайте іншого, потім видаляйте цього.\");\n          return;\n        }\n        if (confirm(`Видалити ${existingMember.name} із сім'ї? Завдання, призначені цій людині, залишаться без відповідального.`)) {\n          state.members = state.members.filter(x => x.id !== existingMember.id);\n          persist();\n          backdrop.remove();\n          renderView();\n        }\n      };\n    }\n  }\n\n  function openChildForm(existingChild){\n    const isEdit = !!existingChild;\n    const c = existingChild || { name: \"\", birthdate: \"\" };\n    const backdrop = document.createElement(\"div\");\n    backdrop.className = \"sheet-backdrop\";\n    backdrop.innerHTML = `\n      <div class=\"sheet\">\n        <h3>${isEdit ? \"Редагувати дитину\" : \"Нова дитина\"}<\/h3>\n        <div class=\"field\">\n          <label>Ім'я<\/label>\n          <input type=\"text\" id=\"childName\" value=\"${escapeHtml(c.name)}\">\n        <\/div>\n        <div class=\"field\">\n          <label>Дата народження<\/label>\n          <input type=\"date\" id=\"childBday\" value=\"${c.birthdate||''}\">\n        <\/div>\n        <div class=\"btn-row\">\n          <button class=\"btn btn-ghost\" id=\"cancelChild\">Скасувати<\/button>\n          <button class=\"btn btn-primary\" id=\"saveChild\">Зберегти<\/button>\n        <\/div>\n        ${isEdit ? `<button class=\"btn btn-danger-ghost\" id=\"deleteChild\" style=\"width:100%; margin-top:10px;\">🗑 Видалити<\/button>` : \"\"}\n      <\/div>\n    `;\n    document.body.appendChild(backdrop);\n    document.getElementById(\"cancelChild\").onclick = () => backdrop.remove();\n    document.getElementById(\"saveChild\").onclick = () => {\n      const name = document.getElementById(\"childName\").value.trim();\n      if (!name) return;\n      const bday = document.getElementById(\"childBday\").value;\n      if (isEdit) {\n        existingChild.name = name;\n        existingChild.birthdate = bday;\n      } else {\n        state.children.push({ id: uid(), name, birthdate: bday });\n      }\n      persist();\n      backdrop.remove();\n      renderView();\n    };\n    if (isEdit) {\n      document.getElementById(\"deleteChild\").onclick = () => {\n        if (confirm(`Видалити ${existingChild.name}?`)) {\n          state.children = state.children.filter(x => x.id !== existingChild.id);\n          persist();\n          backdrop.remove();\n          renderView();\n        }\n      };\n    }\n  }\n\n  /* ---------- Quick Add (task only, for now) ---------- */\n  function openQuickAdd(){\n    const backdrop = document.createElement(\"div\");\n    backdrop.className = \"sheet-backdrop\";\n    backdrop.innerHTML = `\n      <div class=\"sheet\">\n        <h3>Що додати?<\/h3>\n        <button class=\"quick-opt\" data-type=\"task\"><span class=\"ico\">✅<\/span> Завдання<\/button>\n        <button class=\"quick-opt\" data-type=\"shopping\"><span class=\"ico\">🛒<\/span> Покупка<\/button>\n        <button class=\"quick-opt\" data-type=\"payment\"><span class=\"ico\">💰<\/span> Платіж<\/button>\n        <button class=\"btn btn-ghost\" id=\"cancelSheet\" style=\"width:100%; margin-top:6px;\">Скасувати<\/button>\n      <\/div>\n    `;\n    document.body.appendChild(backdrop);\n    backdrop.addEventListener(\"click\", (e) => { if (e.target === backdrop) backdrop.remove(); });\n    document.getElementById(\"cancelSheet\").onclick = () => backdrop.remove();\n    backdrop.querySelector('[data-type=\"task\"]').onclick = () => {\n      backdrop.remove();\n      openTaskForm();\n    };\n    backdrop.querySelector('[data-type=\"shopping\"]').onclick = () => {\n      backdrop.remove();\n      currentView = \"shopping\";\n      renderShell();\n      const nameInput = document.getElementById(\"shopName\");\n      if (nameInput) nameInput.focus();\n    };\n    backdrop.querySelector('[data-type=\"payment\"]').onclick = () => {\n      backdrop.remove();\n      currentView = \"payments\";\n      renderShell();\n      const nameInput = document.getElementById(\"payTitle\");\n      if (nameInput) nameInput.focus();\n    };\n  }\n\n  function openTaskForm(existingTask){\n    const isEdit = !!existingTask;\n    const t = existingTask || {\n      title: \"\", assignedTo: state.members[0] ? state.members[0].id : \"\",\n      dueDate: todayStr(), dueTime: \"\", category: \"Home\", size: \"Medium\",\n      priority: \"Medium\", recurrence: \"None\", tags: [], description: \"\"\n    };\n    const backdrop = document.createElement(\"div\");\n    backdrop.className = \"sheet-backdrop\";\n    backdrop.innerHTML = `\n      <div class=\"sheet\">\n        <h3>${isEdit ? \"Редагувати завдання\" : \"Нове завдання\"}<\/h3>\n        <div class=\"field\">\n          <label>Назва<\/label>\n          <input type=\"text\" id=\"taskTitle\" placeholder=\"Наприклад, Забрати з садочка\" value=\"${escapeHtml(t.title)}\">\n        <\/div>\n        <div class=\"field\">\n          <label>Опис (опціонально)<\/label>\n          <input type=\"text\" id=\"taskDesc\" placeholder=\"Деталі\" value=\"${escapeHtml(t.description||'')}\">\n        <\/div>\n        <div class=\"field\">\n          <label>Відповідальний<\/label>\n          <select class=\"field-input\" id=\"taskAssignee\">\n            ${state.members.map(m => `<option value=\"${m.id}\" ${t.assignedTo===m.id?'selected':''}>${escapeHtml(m.name)}<\/option>`).join(\"\")}\n          <\/select>\n        <\/div>\n        <div class=\"form-grid-2\">\n          <div class=\"field\">\n            <label>Дата<\/label>\n            <input type=\"date\" id=\"taskDate\" value=\"${t.dueDate}\">\n          <\/div>\n          <div class=\"field\">\n            <label>Час (опц.)<\/label>\n            <input type=\"time\" id=\"taskTime\" value=\"${t.dueTime||''}\">\n          <\/div>\n        <\/div>\n        <div class=\"form-grid-2\">\n          <div class=\"field\">\n            <label>Розмір<\/label>\n            <select class=\"field-input\" id=\"taskSize\">\n              ${Object.keys(SIZE_LABELS).map(s => `<option value=\"${s}\" ${t.size===s?'selected':''}>${SIZE_LABELS[s]}<\/option>`).join(\"\")}\n            <\/select>\n          <\/div>\n        <\/div>\n        <details class=\"field\" ${isEdit?'':''}>\n          <summary style=\"cursor:pointer;color:var(--ink-soft);font-size:.9rem;padding:4px 0\">Категорія (для фільтрів)<\/summary>\n          <select class=\"field-input\" id=\"taskCategory\" style=\"margin-top:6px\">\n            ${CATEGORIES.map(c => `<option value=\"${c}\" ${t.category===c?'selected':''}>${categoryLabel(c)}<\/option>`).join(\"\")}\n          <\/select>\n        <\/details>\n        <div class=\"form-grid-2\">\n          <div class=\"field\">\n            <label>Пріоритет<\/label>\n            <select class=\"field-input\" id=\"taskPriority\">\n              ${Object.keys(PRIORITY_LABELS).map(p => `<option value=\"${p}\" ${t.priority===p?'selected':''}>${PRIORITY_LABELS[p]}<\/option>`).join(\"\")}\n            <\/select>\n          <\/div>\n          <div class=\"field\">\n            <label>Повторення<\/label>\n            <select class=\"field-input\" id=\"taskRecurrence\">\n              ${Object.keys(RECURRENCE_LABELS).map(r => `<option value=\"${r}\" ${t.recurrence===r?'selected':''}>${RECURRENCE_LABELS[r]}<\/option>`).join(\"\")}\n            <\/select>\n          <\/div>\n        <\/div>\n        <div class=\"field\">\n          <label>Теги (через кому)<\/label>\n          <input type=\"text\" id=\"taskTags\" placeholder=\"дитина, срочне\" value=\"${(t.tags||[]).join(', ')}\">\n        <\/div>\n        <div class=\"btn-row\">\n          <button class=\"btn btn-ghost\" id=\"cancelTask\">Скасувати<\/button>\n          <button class=\"btn btn-primary\" id=\"saveTask\">Зберегти<\/button>\n        <\/div>\n        ${isEdit ? `\n          <div class=\"modal-actions-row\">\n            <button class=\"btn btn-ghost\" id=\"duplicateTask\">⧉ Дублювати<\/button>\n            <button class=\"btn btn-danger-ghost\" id=\"deleteTask\">🗑 Видалити<\/button>\n          <\/div>\n        ` : \"\"}\n      <\/div>\n    `;\n    document.body.appendChild(backdrop);\n    document.getElementById(\"cancelTask\").onclick = () => backdrop.remove();\n\n    function readForm(){\n      return {\n        title: document.getElementById(\"taskTitle\").value.trim(),\n        description: document.getElementById(\"taskDesc\").value.trim(),\n        assignedTo: document.getElementById(\"taskAssignee\").value,\n        dueDate: document.getElementById(\"taskDate\").value || todayStr(),\n        dueTime: document.getElementById(\"taskTime\").value.trim() || null,\n        category: document.getElementById(\"taskCategory\").value,\n        size: document.getElementById(\"taskSize\").value,\n        priority: document.getElementById(\"taskPriority\").value,\n        recurrence: document.getElementById(\"taskRecurrence\").value,\n        tags: document.getElementById(\"taskTags\").value.split(\",\").map(s => s.trim()).filter(Boolean)\n      };\n    }\n\n    document.getElementById(\"saveTask\").onclick = () => {\n      const vals = readForm();\n      if (!vals.title) return;\n      if (isEdit) {\n        Object.assign(existingTask, vals);\n      } else {\n        state.tasks.push({\n          id: uid(), status: \"Planned\", createdAt: new Date().toISOString(), completedAt: null,\n          ...vals\n        });\n      }\n      persist();\n      backdrop.remove();\n      renderView();\n    };\n\n    if (isEdit) {\n      document.getElementById(\"duplicateTask\").onclick = () => {\n        const vals = readForm();\n        state.tasks.push({\n          id: uid(), status: \"Planned\", createdAt: new Date().toISOString(), completedAt: null,\n          ...vals\n        });\n        persist();\n        backdrop.remove();\n        renderView();\n      };\n      document.getElementById(\"deleteTask\").onclick = () => {\n        if (confirm(\"Видалити це завдання?\")) {\n          state.tasks = state.tasks.filter(x => x.id !== existingTask.id);\n          persist();\n          backdrop.remove();\n          renderView();\n        }\n      };\n    }\n  }\n\n  window.__setView = function(v){ if (state.members.length < 2) return; currentView = (v===\"dashboard\"?\"tasks\":v); renderShell(); };\n  window.__reload = function(){ state = loadData(); normalizeState(); applyTheme(); render(); };\n  render();\n})();\n<\/script>\n<\/body>\n<\/html>\n";

function usCard(x){const mine=x.by===me(),seenBy=Object.keys(x.seen||{}).find(k=>k!==x.by),opts=ST_OPT[x.type]||[],grp=x.type==='idea'?(IDEA_GRP[x.grp]||''):'',closed=['done','no','solved'].includes(x.st);

 <p style="margin:8px 0;white-space:pre-wrap">${esc(x.text)}</p>${x.when?`<p class=mute>⏰ ${new Date(x.when).toLocaleString('uk-UA',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</p>`:''}

 <div class=row>${mine?(x.type!=='complaint'?`<button class="btn ghost sm" onclick="usSt('${x.id}','done')">✅ Зроблено</button>`:`<button class="btn ghost sm" onclick="usSt('${x.id}','solved')">✅ Вирішено</button>`)+`<button class="btn ghost sm" onclick="usDel('${x.id}')">🗑 Видалити</button>`:opts.map(o=>`<button class="btn ${x.st===o[0]?'':'ghost'} sm" onclick="usSt('${x.id}','${o[0]}')">${o[1]}</button>`).join('')+`<button class="btn ghost sm" onclick="usReplyModal('${x.id}')">💬 Відповісти</button>`}</div></div>`}
function vUs(){if(!S.me)return`<div class=card><h3>💞 Ми</h3><p class=mute>Тут можна залишати одне одному пропозиції, бажання (пиріжки, шоколадка) і скарги, а партнер отримає сповіщення. Спершу вкажіть, як вас підписувати.</p><div class=row><button class=btn onclick=usNameModal()>Вказати ім’я</button></div></div>`;

 let h=`<div class=chips>${Object.keys(US_TYPES).map(btn).join('')}<button class="btn ${usTab==='ai'?'':'ghost'} sm" onclick="usSet('ai')">Огляд ШІ</button></div><p class=note style="text-align:center">Ви: <b>${esc(S.me)}</b> · <a href="#" onclick="usSettings();return false" style="color:var(--acc)">налаштування сповіщень</a></p>`;
 if(usTab==='ai')return h+vUsAI();

 h+=`<div class=row><button class=btn onclick="usAdd('${usTab}')">＋ Додати ${US_TYPES[usTab].one==='нову пропозицію'?'пропозицію':US_TYPES[usTab].one==='нове бажання'?'бажання':'скаргу'}</button></div>`;
 if(usTab==='complaint')h+='<p class=note style="text-align:center">Пишіть як є, а кнопка «Перефразувати» допоможе сказати це спокійно й так, щоб почули. Партнер побачить лише те, що ви надішлете.</p>';
 h+=L.length?L.map(usCard).join(''):`<div class="card ctr"><p class=mute>Поки порожньо. Натисніть кнопку вище, щоб додати перший запис.</p></div>`;
 clearTimeout(usSeen.t);usSeen.t=setTimeout(usSeen,2500);return h}
function usAdd(type){usOrig='';usRephText='';
 const grp=type==='idea'?`<label>Про що<select id=u_grp>${Object.keys(IDEA_GRP).map(k=>`<option value="${k}">${IDEA_GRP[k]}</option>`).join('')}</select></label>`:'';
 const quick=type==='wish'?`<div class=row style="flex-wrap:wrap">${WISH_QUICK.map(q=>`<button type=button class="btn ghost sm" style="flex:0 0 auto" onclick="usQuick(this.textContent)">${q}</button>`).join('')}</div>`:'';
 const when=type==='idea'?`<label>Коли (необов’язково)<input type=datetime-local id=u_when></label>`:'';
 const ph={idea:'Наприклад: давай у суботу ввечері вдвох піти прогулятись, поки малюк спить',wish:'Наприклад: хочу пиріжків із вишнею',complaint:'Напишіть як є. Перефразовувати чи ні — вирішите самі'}[type];

function usQuick(t){const e=$('#u_text');e.value=t+(e.value?' — '+e.value:'');const g=$('#u_grp');if(g)g.value=t}

 if(type==='wish'){const q=WISH_QUICK.find(k=>text.startsWith(k));if(q)x.grp=q}

async function aiCall(prompt,max=1200){const key=localStorage.getItem('sb_key');if(!key)throw new Error('NOKEY');
 const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:localStorage.getItem('sb_model')||'claude-sonnet-5-5',max_tokens:max,messages:[{role:'user',content:prompt}]})});
 const j=await r.json();if(!r.ok)throw new Error(j.error&&j.error.message||'HTTP '+r.status);return(j.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('\n').trim()}
const aiErr=e=>e.message==='NOKEY'?'Вставте API-ключ Anthropic.':e.message==='Failed to fetch'?'Немає інтернету або запит заблоковано браузером.':e.message;
function usKey(){const k=$('#us_key');if(k&&k.value.trim()){try{localStorage.setItem('sb_key',k.value.trim())}catch(e){}}}
function rephPrompt(text,tone){const T={soft:'Зроби максимально м’яко й тепло.',short:'Зроби якомога коротше: 1–2 речення.',direct:'Зроби чітко й прямо, але спокійно й без образ.'}[tone]||'';
 return`Перефразуй скаргу одного партнера іншому так, щоб її було легко почути і не виникло оборони.
Правила: збережи суть і факти, нічого не вигадуй і не додавай; прибери образи, лайку, сарказм, звинувачення й узагальнення («ти завжди», «ти ніколи»); формулюй як «я-повідомлення»: що сталося (конкретно) → що я відчуваю → про що прошу (конкретне, виконуване прохання); 1–3 речення; українською; без повчань, без привітань і пояснень. ${T}
Якщо в тексті є погрози, залякування чи ознаки насильства — не перефразовуй, а відповідай одним реченням: «Схоже, ситуація серйозна — краще поговорити з фахівцем або близькою людиною».
Текст скарги:
"""${text}"""
Поверни лише переписаний текст.`}
async function usReph(tone){const ta=$('#u_text'),E=t=>{$('#err').textContent=t};if(!usOrig)usOrig=(ta.value||'').trim();if(usOrig.length<3)return E('Спершу напишіть, що вас турбує.');usKey();E('');
 const b=$('#u_ai');b.disabled=true;b.textContent='Перефразовую…';
 try{usRephText=await aiCall(rephPrompt(usOrig,tone),500);$('#reph').innerHTML=`<div class=card><div class=note>Варіант від ШІ</div><div style="white-space:pre-wrap;margin:6px 0">${esc(usRephText)}</div><div class=row><button type=button class="btn sm" onclick="usUse()">Використати</button><button type=button class="btn ghost sm" onclick="usReph('soft')">М’якше</button><button type=button class="btn ghost sm" onclick="usReph('short')">Коротше</button><button type=button class="btn ghost sm" onclick="usReph('direct')">Прямо</button></div></div>`;const k=$('#us_keybox');if(k)k.style.display='none'}
 catch(e){E('Не вдалося перефразувати: '+aiErr(e))}finally{b.disabled=false;b.textContent='✨ Перефразувати (ШІ)'}}
function usUse(){$('#u_text').value=usRephText;toast('Текст замінено. Перевірте й надішліть.')}
function usCopyReph(){const t=($('#u_text').value||'').trim();if(t.length<3)return toast('Спершу напишіть текст.');navigator.clipboard.writeText(rephPrompt(t,'soft')).then(()=>toast('Запит скопійовано. Вставте його в чат Claude.')).catch(()=>toast('Не вдалося скопіювати.'))}

 const cnt=t=>O.filter(x=>x.type===t),ok=t=>cnt(t).filter(x=>['yes','done','solved'].includes(x.st)).length,lat=O.map(x=>{const o=Object.keys(x.seen||{}).filter(k=>k!==x.by).map(k=>x.seen[k]);return o.length?Math.min(...o)-x.ts:null}).filter(v=>v!=null);
 return{O,by,ok,cnt,lat}}

 return`<div class=card><h3>📊 За 30 днів</h3>${s.O.length?`<p>💡 Пропозицій: <b>${s.cnt('idea').length}</b> (підтримано/зроблено ${s.ok('idea')})<br>🎁 Бажань: <b>${s.cnt('wish').length}</b> (виконано/буде ${s.ok('wish')})<br>💬 Скарг: <b>${s.cnt('complaint').length}</b> (вирішено/обговорено ${s.ok('complaint')})</p>${names.length?`<p class=mute>${names.map(n=>esc(n)+': '+(s.by[n].idea+s.by[n].wish+s.by[n].complaint)+' записів').join(' · ')}</p>`:''}${s.lat.length?`<p class=mute>Партнер зазвичай бачить запис за ≈ ${fd(avg(s.lat))}.</p>`:''}`:'<p class=mute>Поки що немає записів за 30 днів.</p>'}</div>
 <div class=card><h3>🤖 ШІ-огляд стосунків і побажань</h3><p class=mute>ШІ знайде повторювані теми, підкаже, що важливо кожному, що вже працює, і запропонує кілька кроків і м’яких фраз для розмови. Це не психотерапія й не оцінка, хто правий.</p>${localStorage.getItem('sb_key')?'':'<label>API-ключ Anthropic<input type=password id=us_key autocomplete=off></label>'}<p class=err id=err></p>
 <div class=row><button class=btn id=us_go onclick="usAnalyze()" ${s.O.length<3?'disabled':''}>Зробити огляд</button><button class="btn ghost" onclick="usCopyReport()" ${s.O.length<3?'disabled':''}>Скопіювати запит</button></div><p class=note>Для огляду потрібно хоча б 3 записи. Тексти за 60 днів надсилаються до Anthropic без імен (як «Партнер А/Б»).</p>
 ${L?`<div class=card><h3>Останній огляд · ${new Date(L.t).toLocaleString('uk-UA')}</h3><div>${md(L.text)}</div><p class=note>Згенеровано ШІ, може містити помилки. Це не порада фахівця.</p></div>`:''}</div>`}
function usReport(){const O=ours().filter(x=>x.ts>Date.now()-60*DAY).sort((a,b)=>a.ts-b.ts).slice(-80),names=[...new Set(O.map(x=>x.by))],nm=n=>'Партнер '+'АБВГ'[Math.max(0,names.indexOf(n))],T={idea:'пропозиція',wish:'бажання',complaint:'скарга'};
 const rows=O.map(x=>`- ${new Date(x.ts).toLocaleDateString('uk-UA')} | ${T[x.type]}${x.grp?' ('+(IDEA_GRP[x.grp]||x.grp)+')':''} | від: ${nm(x.by)} | «${String(x.text).slice(0,300)}» | статус: ${ST_LBL[x.st]||'без відповіді'}${x.reply?' | відповідь ('+nm(x.rb)+'): «'+String(x.reply).slice(0,200)+'»':''}${Object.keys(x.seen||{}).some(k=>k!==x.by)?' | прочитано':''}`).join('\n');
 return`Ти — уважний помічник, який допомагає парі краще чути одне одного. Нижче — записи двох партнерів у спільному сімейному додатку за останні місяці: пропозиції, бажання (дрібні радощі) і скарги. Це не терапія і не вирок: не став діагнозів, не визначай, хто правий, не бери чиюсь сторону. Відповідай українською, тепло, просто, без повчань.

Структура: 1) Загальна картина — 2–3 речення; 2) Що, схоже, важливо кожному (потреби, а не претензії); 3) Повторювані теми; 4) Що вже працює (підтримані ідеї, виконані бажання); 5) 3 конкретні маленькі кроки на цей тиждень; 6) 2–3 м’які фрази, якими можна почати розмову; 7) Обмеження: ти бачиш лише короткі записи й не знаєш контексту.
Якщо в записах є ознаки насильства, залякування чи страху — спокійно скажи, що варто звернутися до фахівців (у Німеччині, наприклад, Hilfetelefon «Gewalt gegen Frauen» 116 016, цілодобово й безкоштовно) і не давай порад «як поладнати».

Записи (${O.length}):
${rows}`}

/* ================= Хмарна синхронізація (Firebase Auth + Firestore) =================
   Модель: кожен профіль (c), запис сну (s) і план (p) — окремий документ families/{uid}/items/{c|s|p}:{id}.
   Локальні зміни виявляються автоматично (reconcile), перемагає пізніша зміна (upd), видалення — «надгробки».
   Працює й без хмари: усе спершу зберігається на пристрої, а в хмару йде, коли є зв’язок. */
const FB_URL='https://www.gstatic.com/firebasejs/10.12.2/';
const h53=s=>{let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}
 a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)};
let Y={uid:null,since:0,items:{}}; // стан синхронізації: items[ключ]={h:хеш вмісту, upd, del, pushed:upd, що вже в хмарі}
const pendingCount=()=>Object.keys(Y.items).filter(k=>Y.items[k].upd>Y.items[k].pushed).length;
function flat(T){const m=new Map();T.children.forEach(c=>m.set('c:'+c.id,c));T.sleeps.forEach(r=>m.set('s:'+r.id,r));Object.keys(T.plans||{}).forEach(k=>m.set('p:'+k,T.plans[k]));(T.ours||[]).forEach(x=>m.set('w:'+x.id,x));if(T.fam)m.set('g:fam',T.fam);if(T.fo)for(const k in FOK)(T.fo[FOK[k]]||[]).forEach(x=>{if(x&&x.id)m.set(k+':'+x.id,x)});return m}
/* Порівнює дані з останнім відомим станом: нове/змінене отримує свіжий upd, зникле стає «надгробком». */
function reconcile(T,I,now=Date.now()){const cur=flat(T);let n=0;
 cur.forEach((o,k)=>{const h=h53(JSON.stringify(o)),e=I[k];if(!e||e.del||e.h!==h){I[k]={h,upd:Math.max(now,e?e.upd+1:0),del:false,pushed:e?e.pushed:0};n++}});
 for(const k in I){if(!I[k].del&&!cur.has(k)){I[k]={h:'',upd:Math.max(now,I[k].upd+1),del:true,pushed:I[k].pushed};n++}}
 return n}
/* Застосовує документи з хмари: новіший upd перемагає. Повертає кількість змін. */
function applyBatch(T,I,docs){let n=0;const cm=new Map(T.children.map(c=>[c.id,c])),sm=new Map(T.sleeps.map(r=>[r.id,r])),om=new Map((T.ours||[]).map(x=>[x.id,x])),fm={},gf=k=>fm[k]||(fm[k]=new Map(((T.fo||{})[FOK[k]]||[]).map(x=>[x.id,x])));
 for(const d of docs){const k=d.k+':'+d.id,e=I[k],lu=e?e.upd:0;
  if(d.upd<lu)continue;
  if(d.upd===lu){if(e&&!!e.del===!!d.del)e.pushed=Math.max(e.pushed,d.upd);continue}
  if(!['c','s','p','w','g'].includes(d.k)&&!FOK[d.k])continue;
  let o=null;if(!d.del){try{o=JSON.parse(d.json)}catch(x){continue}}
  if(d.k==='c'){d.del?cm.delete(d.id):cm.set(d.id,o)}else if(d.k==='s'){d.del?sm.delete(d.id):sm.set(d.id,o)}else if(d.k==='w'){d.del?om.delete(d.id):om.set(d.id,o)}else if(d.k==='g'){if(d.del)delete T.fam;else T.fam=o}else if(FOK[d.k]){const M=gf(d.k);d.del?M.delete(d.id):M.set(d.id,o)}else{if(d.del)delete T.plans[d.id];else T.plans[d.id]=o}
  I[k]={h:d.del?'':h53(JSON.stringify(o)),upd:d.upd,del:!!d.del,pushed:d.upd};n++}
 if(n){T.children=[...cm.values()];T.sleeps=[...sm.values()];T.ours=[...om.values()];for(const k in fm){T.fo=T.fo||foDef();T.fo[FOK[k]]=[...fm[k].values()]}}
 return n}
